<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"><title>কোচিং ম্যানেজার</title><style>
  :root{ --primary:#1F4E78; --primary-light:#2E6DA4; --accent:#2e7d32; --danger:#b02a2a; --warn:#b06a00; --bg:#f3f5f8; --card:#ffffff; --border:#e0e4ea; --text:#22303f; --muted:#6b7684; --yellow:#fff2cc; --green:#e2efda; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans Bengali','Nirmala UI','Kalpurush',sans-serif; padding-bottom:70px; }
  header{ background:var(--primary); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; }
  header h1{font-size:18px; margin:0;} header .sub{font-size:11px; opacity:.85;}
  nav.tabs{ display:flex; overflow-x:auto; background:#173a5c; position:sticky; top:52px; z-index:19; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ flex:0 0 auto; background:none; border:none; color:#cfe0f0; padding:10px 14px; font-size:13px; font-family:inherit; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
  nav.tabs button.active{color:#fff; border-bottom-color:#ffb703; font-weight:bold;}
  main{padding:12px; max-width:900px; margin:0 auto;}
  .card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--primary);}
  .card h3.sub-h{font-size:13px; margin:14px 0 8px; color:var(--muted);}
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .kpi .val{font-size:19px; font-weight:bold; color:var(--primary);}
  .kpi.profit .val{color:var(--accent);} .kpi.due .val{color:var(--danger);}
  .kpi .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select, textarea{ width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px; font-family:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary-light); border-color:var(--primary-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  button.btn{ background:var(--primary); color:#fff; border:none; border-radius:7px; padding:10px 14px; font-size:14px; font-family:inherit; margin-top:10px; width:100%; cursor:pointer; }
  button.btn.secondary{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  button.btn.danger{background:var(--danger);}
  button.btn.small{width:auto; padding:6px 10px; font-size:12px; margin:0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:7px 6px; border-bottom:1px solid var(--border); text-align:right;}
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2){text-align:left;}
  th{background:#f0f3f7; color:var(--primary); font-size:12px;}
  .table-wrap{overflow-x:auto;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;}
  .pill.ok{background:var(--green); color:var(--accent);}
  .pill.warn{background:var(--yellow); color:#7a5b00;}
  .pill.bad{background:#fbe4e4; color:var(--danger);}
  .search-box{display:flex; gap:8px; margin-bottom:10px;}
  .search-box input{flex:1;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px;}
  .divider{height:1px; background:var(--border); margin:12px 0;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:13px;}
  .profile-grid .k{color:var(--muted);} .profile-grid .v{font-weight:bold;}
  .receipt{border:2px solid var(--primary); border-radius:10px; padding:18px; background:#fff;}
  .print-header{display:flex; align-items:center; gap:12px; margin-bottom:10px; border-bottom:2px solid var(--primary); padding-bottom:10px;}
  .print-header img{height:52px; width:52px; object-fit:contain; border-radius:8px;}
  .print-header .logo-fallback{ height:52px; width:52px; border-radius:8px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px; }
  .print-header .pinfo{flex:1;}
  .print-header .pname{font-size:19px; font-weight:bold; color:var(--primary); margin:0;}
  .print-header .pmeta{font-size:11px; color:var(--muted);}
  .doc-title{text-align:center; font-size:13px; font-weight:bold; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .receipt table td{border:none; padding:4px 0;}
  .amount-box{ text-align:center; font-size:22px; font-weight:bold; color:var(--accent); border:1px dashed var(--accent); border-radius:8px; padding:8px; margin:10px 0; }
  .sign-row{display:flex; justify-content:space-between; margin-top:36px; font-size:12px;}
  .sign-row div{border-top:1px solid #999; padding-top:4px; width:40%; text-align:center;}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .tag-row button{ border:1px solid var(--border); background:#fff; border-radius:20px; padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; }
  .tag-row button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .att-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .att-item{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1 1 45%; display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:6px; }
  .att-toggle{border:none; border-radius:20px; padding:5px 12px; font-size:12px; font-family:inherit; color:#fff; min-width:80px; cursor:pointer;}
  .att-toggle.present{background:var(--accent);} .att-toggle.absent{background:var(--danger);} .att-toggle.leave{background:var(--warn);}
  .subj-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .subj-row input{flex:1;} .subj-row input.full-inp{max-width:70px;} .subj-row input.obt-inp{max-width:70px;}
  .subj-row button{flex:0 0 auto; background:#fbe4e4; color:var(--danger); border:none; border-radius:6px; padding:6px 9px; font-size:12px; cursor:pointer;}
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show{opacity:1;}
  .seg{display:flex; border:1px solid var(--primary); border-radius:8px; overflow:hidden; margin-bottom:10px;}
  .seg button{flex:1; background:#fff; color:var(--primary); border:none; padding:8px; font-size:13px; font-family:inherit; cursor:pointer;}
  .seg button.active{background:var(--primary); color:#fff;}
  .day-head{background:#eef2f7; font-weight:bold; padding:6px 8px; font-size:12px; border-radius:6px; margin:10px 0 4px;}
  @media print{ header, nav.tabs, .no-print{display:none !important;} main{padding:0;} body{padding:0;} }
</style></head><body>

<header>
  <div>
    <h1>কোচিং ম্যানেজার</h1>
    <div class="sub" id="headerSub">সব ডেটা এই ফোনেই সংরক্ষিত থাকে</div>
  </div>
  <button class="btn small secondary no-print" style="width:auto;margin:0;" onclick="showTab('settings')">⚙ সেটিংস</button>
</header>

<nav class="tabs no-print" id="tabNav">
  <button data-tab="dashboard">ড্যাশবোর্ড</button>
  <button data-tab="students">স্টুডেন্ট</button>
  <button data-tab="payments">পেমেন্ট</button>
  <button data-tab="attendance">উপস্থিতি</button>
  <button data-tab="exams">পরীক্ষা</button>
  <button data-tab="reports">রিপোর্ট</button>
  <button data-tab="staff">স্টাফ ও বেতন</button>
  <button data-tab="expenses">অন্যান্য ব্যয়</button>
  <button data-tab="search">🔍 সার্চ</button>
  <button data-tab="summary">সারসংক্ষেপ</button>
</nav>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const CLASSES = ["ষষ্ঠ শ্রেণী","সপ্তম শ্রেণী","অষ্টম শ্রেণী","নবম শ্রেণী","দশম শ্রেণী","একাদশ শ্রেণী","দ্বাদশ শ্রেণী"];
const CLASS_CODE = {"ষষ্ঠ শ্রেণী":"6","সপ্তম শ্রেণী":"7","অষ্টম শ্রেণী":"8","নবম শ্রেণী":"9","দশম শ্রেণী":"10","একাদশ শ্রেণী":"11","দ্বাদশ শ্রেণী":"12"};
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const SUBJECTS = ["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","ধর্ম/আইসিটি","সমাজ/অন্যান্য"];
const PAY_METHODS = ["নগদ","বিকাশ","রকেট","ব্যাংক ট্রান্সফার"];
const EXP_CATS = ["ভাড়া","বিদ্যুৎ বিল","স্টেশনারি","ইন্টারনেট/ফোন","রক্ষণাবেক্ষণ","বিজ্ঞাপন","অন্যান্য"];
const EXAM_TYPES = ["ক্লাস টেস্ট","অধ্যায় ভিত্তিক টেস্ট","মাসিক টেস্ট","সারপ্রাইজ টেস্ট","মডেল টেস্ট"];
const SUBJECT_TEMPLATES = {
  "ক্লাস টেস্ট": [{name:"",cqFull:10,mcqFull:0}],
  "অধ্যায় ভিত্তিক টেস্ট": [{name:"",cqFull:20,mcqFull:5}],
  "মাসিক টেস্ট": SUBJECTS.map(s=>({name:s, cqFull:70, mcqFull:30})),
  "সারপ্রাইজ টেস্ট": [{name:"",cqFull:20,mcqFull:0}],
  "মডেল টেস্ট": SUBJECTS.map(s=>({name:s, cqFull:70, mcqFull:30}))
};
const STORE_KEY = "coachingAppData_v2";

function defaultDB(){
  const classFees = {}; CLASSES.forEach(c=>classFees[c]=800);
  return {
    meta:{ classSeq:{}, receiptSeq:0, staffSeq:0, expenseSeq:0, examSeq:0, instituteName:"Educare Coaching", institutePhone:"01717046168", instituteAddress:"Gobindaganj, Gaibandha", logoDataUrl:null, firebaseUrl:"", firebasePath:"coaching_data", updatedAt:0 },
    classFees,
    settings:{ payMethods:[...PAY_METHODS], expCats:[...EXP_CATS], examTypes:[...EXAM_TYPES], subjectTemplates: JSON.parse(JSON.stringify(SUBJECT_TEMPLATES)), gradeScale:[{min:80,label:"A+"},{min:70,label:"A"},{min:60,label:"A-"},{min:50,label:"B"},{min:40,label:"C"},{min:0,label:"F"}] },
    students:[], payments:[], attendance:[], exams:[], staff:[], staffPayments:[], expenses:[]
  };
}

let db = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign(defaultDB(), JSON.parse(raw));
  }catch(e){}
  return defaultDB();
}

function save(){
  db.meta.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
  pushToCloud();
}

async function pushToCloud(){
  if(!db.meta.firebaseUrl) return;
  try{
    const url = `${db.meta.firebaseUrl.replace(/\/$/,"")}/${(db.meta.firebasePath||"coaching_data").replace(/^\/|\/$/g,"")}.json`;
    await fetch(url, { method:'PUT', body: JSON.stringify(db) });
  }catch(e){}
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function pad(n,len){ return String(n).padStart(len,"0"); }
function nextStudentId(cls){ db.meta.classSeq[cls] = (db.meta.classSeq[cls]||0)+1; return `${CLASS_CODE[cls]}-${pad(db.meta.classSeq[cls],3)}`; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return "৳" + Math.round(n||0).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return "-"; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function monthNameFromDate(d){ if(!d) return ""; return MONTHS[new Date(d).getMonth()]; }
function yearFromDate(d){ if(!d) return null; return new Date(d).getFullYear(); }
function getStudent(id){ return db.students.find(s=>s.id===id); }
function activeStudents(cls){
  let list = db.students.filter(s=>s.status!=="নিষ্ক্রিয়");
  if(cls && cls!=="সব") list = list.filter(s=>s.class===cls);
  return list;
}

function studentPayments(id){ return db.payments.filter(p=>p.studentId===id); }
function studentTotalPaid(id){ return studentPayments(id).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentExpectedTotal(st){
  if(!st.admissionDate) return 0;
  const adm = new Date(st.admissionDate); const now = new Date();
  let months = (now.getFullYear()-adm.getFullYear())*12 + (now.getMonth()-adm.getMonth()) + 1;
  return Math.max(0, months) * Number(st.fee||0);
}
function studentDue(st){ return studentExpectedTotal(st) - studentTotalPaid(st.id); }

function paymentsFiltered(cls, year){
  let list = db.payments;
  if(cls && cls!=="সব") list = list.filter(p=>{ const s=getStudent(p.studentId); return s && s.class===cls; });
  if(year) list = list.filter(p=>yearFromDate(p.date)===year);
  return list;
}
function monthlyIncome(month, year, cls){ return paymentsFiltered(cls, year).filter(p=>monthNameFromDate(p.date)===month).reduce((s,p)=>s+Number(p.amount||0),0); }
function monthlySalaryExpense(month, year){ return db.staffPayments.filter(p=>p.month===month && (!year || yearFromDate(p.date)===year)).reduce((s,p)=>s+Number(p.amount||0),0); }
function monthlyOtherExpense(month, year){ return db.expenses.filter(e=>e.month===month && (!year || yearFromDate(e.date)===year)).reduce((s,e)=>s+Number(e.amount||0),0); }

function gradeFromPct(pct){
  const scale = [...db.settings.gradeScale].sort((a,b)=>b.min-a.min);
  for(const g of scale){ if(pct>=g.min) return g.label; }
  return scale.length ? scale[scale.length-1].label : "-";
}

function printHeaderHtml(docTitle){
  const m = db.meta;
  const logo = m.logoDataUrl ? `<img src="${m.logoDataUrl}" alt="logo">` : `<div class="logo-fallback">${(m.instituteName||"EC").slice(0,2).toUpperCase()}</div>`;
  return `<div class="print-header">${logo}<div class="pinfo"><div class="pname">${m.instituteName||""}</div><div class="pmeta">${m.instituteAddress||""}${m.instituteAddress&&m.institutePhone?' · ':''}${m.institutePhone?('Phone: '+m.institutePhone):''}</div></div></div><div class="doc-title">${docTitle}</div>`;
}

let currentTab = 'payments';
document.getElementById('tabNav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]');
  if(b) showTab(b.dataset.tab);
});

function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = "";
  const fns = {
    dashboard: renderDashboard, students: renderStudents, payments: renderPayments,
    attendance: renderAttendance, exams: renderExams, reports: renderDashboard,
    staff: renderStaff, expenses: renderExpenses, summary: renderDashboard,
    settings: renderSettings, search: renderSearch, studentProfile: renderStudentProfile,
    receipt: renderReceipt
  };
  try{ (fns[currentTab]||renderPayments)(); }catch(err){ app.innerHTML = `<div class="card"><div class="empty">সমস্যা হয়েছে, অন্য ট্যাবে ক্লিক করুন।</div></div>`; }
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
  const app = document.getElementById('app');
  const curMonth = MONTHS[new Date().getMonth()];
  const curYear = new Date().getFullYear();
  const income = monthlyIncome(curMonth, curYear);
  const salExp = monthlySalaryExpense(curMonth, curYear);
  const otherExp = monthlyOtherExpense(curMonth, curYear);
  const profit = income - salExp - otherExp;
  const totalDue = activeStudents().reduce((s,st)=>s+Math.max(0,studentDue(st)),0);

  app.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="val">${activeStudents().length}</div><div class="lbl">সক্রিয় স্টুডেন্ট</div></div>
      <div class="kpi"><div class="val">${fmtMoney(income)}</div><div class="lbl">${curMonth} মাসের আয়</div></div>
      <div class="kpi"><div class="val">${fmtMoney(salExp+otherExp)}</div><div class="lbl">${curMonth} মাসের ব্যয়</div></div>
      <div class="kpi profit"><div class="val">${fmtMoney(profit)}</div><div class="lbl">${curMonth} মাসের মুনাফা</div></div>
      <div class="kpi due" style="grid-column:span 2"><div class="val">${fmtMoney(totalDue)}</div><div class="lbl">মোট বকেয়া</div></div>
    </div>`;
}

// ---------------- PAYMENTS ----------------
let paymentCls = "সব"; let paymentYear = new Date().getFullYear(); let activeReceiptId = null;
function renderPayments(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>ফি গ্রহণ করুন</h2>
      <form id="payForm">
        <div class="row2">
          <div><label>শ্রেণী</label><select id="p_class"><option value="">বাছাই করুন...</option>${CLASSES.map(c=>`<option>${c}</option>`).join("")}</select></div>
          <div><label>স্টুডেন্ট</label><select id="p_student" required><option value="">আগে শ্রেণী বেছে নিন</option></select></div>
        </div>
        <div id="p_student_info" style="font-size:12px; color:var(--primary); margin-top:4px; font-weight:bold;"></div>
        <div class="row2">
          <div><label>কোন মাসের ফি</label><select id="p_month">${MONTHS.map(m=>`<option ${m===MONTHS[new Date().getMonth()]?'selected':''}>${m}</option>`).join("")}</select></div>
          <div><label>পরিমাণ (৳)</label><input id="p_amount" type="number" required></div>
        </div>
        <div class="row2">
          <div><label>পেমেন্ট মাধ্যম</label><select id="p_method">${db.settings.payMethods.map(m=>`<option>${m}</option>`).join("")}</select></div>
          <div><label>তারিখ</label><input id="p_date" type="date" value="${todayStr()}"></div>
        </div>
        <label>নোট / রেফারেন্স (ঐচ্ছিক)</label>
        <div class="search-box">
          <input id="p_note" placeholder="যেমন: বিকাশ ট্রানজেকশন আইডি">
          <button type="submit" class="btn" style="margin:0; width:auto;">ফি জমা নিন ও রিসিট তৈরি করুন</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>পেমেন্ট হিস্ট্রি</h2>
      <div class="row2" style="margin-bottom:10px;">
        <div><label>শ্রেণী ফিল্টার</label><select id="p_filter_cls"><option>সব</option>${CLASSES.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div><label>বছর ফিল্টার</label><select id="p_filter_yr">${[paymentYear, paymentYear-1].map(y=>`<option>${y}</option>`).join("")}</select></div>
      </div>
      <div class="table-wrap" id="payTableWrap"></div>
    </div>`;

  const pClassSel = document.getElementById('p_class');
  const pStuSel = document.getElementById('p_student');
  const pInfo = document.getElementById('p_student_info');

  pClassSel.addEventListener('change', e=>{
    const cls = e.target.value;
    const stus = activeStudents(cls);
    pStuSel.innerHTML = stus.length ? stus.map(s=>`<option value="${s.id}">${s.name} (${s.id})</option>`).join("") : `<option value="">কোনো সক্রিয় স্টুডেন্ট নেই</option>`;
    updatePayStuInfo();
  });

  pStuSel.addEventListener('change', updatePayStuInfo);

  function updatePayStuInfo(){
    const s = getStudent(pStuSel.value);
    if(!s){ pInfo.innerHTML = ""; return; }
    const due = studentDue(s);
    document.getElementById('p_amount').value = s.fee;
    pInfo.innerHTML = `মাসিক ফি: ${fmtMoney(s.fee)} | বকেয়া: ${fmtMoney(Math.max(0,due))}`;
  }

  document.getElementById('payForm').addEventListener('submit', e=>{
    e.preventDefault();
    const stId = pStuSel.value;
    if(!stId){ toast("স্টুডেন্ট নির্বাচন করুন"); return; }
    db.meta.receiptSeq = (db.meta.receiptSeq||0)+1;
    const recId = `REC-${pad(db.meta.receiptSeq,4)}`;
    const payData = { id: recId, studentId: stId, forMonth: document.getElementById('p_month').value, amount: Number(document.getElementById('p_amount').value||0), method: document.getElementById('p_method').value, date: document.getElementById('p_date').value, note: document.getElementById('p_note').value.trim() };
    db.payments.push(payData); save(); toast("পেমেন্ট সফলভাবে সংরক্ষণ করা হয়েছে");
    openReceipt(recId);
  });

  document.getElementById('p_filter_cls').addEventListener('change', e=>{ paymentCls = e.target.value; renderPayTable(); });
  document.getElementById('p_filter_yr').addEventListener('change', e=>{ paymentYear = Number(e.target.value); renderPayTable(); });

  renderPayTable();
}

function renderPayTable(){
  const wrap = document.getElementById('payTableWrap');
  const list = paymentsFiltered(paymentCls, paymentYear).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(list.length===0){ wrap.innerHTML = `<div class="empty">কোনো ডাটা নেই</div>`; return; }
  wrap.innerHTML = `<table><tr><th>রিসিট</th><th>স্টুডেন্ট</th><th>মাস</th><th>পরিমাণ</th><th></th></tr>
    ${list.map(p=>{ const s=getStudent(p.studentId); return `<tr><td>${p.id}</td><td>${s?s.name:'-'}</td><td>${p.forMonth}</td><td>${fmtMoney(p.amount)}</td><td><button class="btn small secondary" onclick="openReceipt('${p.id}')">রিসিট</button></td></tr>`; }).join("")}
  </table>`;
}

function openReceipt(recId){ activeReceiptId = recId; currentTab='receipt'; render(); }
function renderReceipt(){
  const app = document.getElementById('app');
  const p = db.payments.find(x=>x.id===activeReceiptId);
  if(!p) return;
  const s = getStudent(p.studentId);
  app.innerHTML = `
    <div class="no-print" style="margin-bottom:10px;"><button class="btn secondary" onclick="showTab('payments')">← ফিরে যান</button> <button class="btn" style="width:auto; display:inline-block;" onclick="window.print()">প্রিন্ট করুন</button></div>
    <div class="receipt">
      ${printHeaderHtml("পেমেন্ট রিসিট")}
      <table>
        <tr><td><b>রিসিট নং:</b> ${p.id}</td><td style="text-align:right"><b>তারিখ:</b> ${fmtDate(p.date)}</td></tr>
        <tr><td><b>আইডি:</b> ${s?s.id:'-'}</td><td style="text-align:right"><b>শ্রেণী:</b> ${s?s.class:'-'}</td></tr>
        <tr><td colspan="2"><b>স্টুডেন্ট নাম:</b> ${s?s.name:'-'}</td></tr>
        <tr><td colspan="2"><b>মাস:</b> ${p.forMonth}</td></tr>
        <tr><td colspan="2"><b>পেমেন্ট মাধ্যম:</b> ${p.method} ${p.note?`(${p.note})`:''}</td></tr>
      </table>
      <div class="amount-box">জমা: ${fmtMoney(p.amount)}</div>
    </div>`;
}

// ---------------- STUDENTS ----------------
let studentSearch = ""; let studentClassFilter = "সব"; let editingStudentId = null;
function renderStudents(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card"><h2>${editingStudentId ? "তথ্য পরিবর্তন" : "নতুন স্টুডেন্ট যোগ"}</h2><form id="studentForm"></form></div>
    <div class="card">
      <h2>স্টুডেন্ট তালিকা (${db.students.length})</h2>
      <div class="tag-row" id="stuClassTags"></div>
      <div class="search-box"><input id="stuSearch" placeholder="খুঁজুন..." value="${studentSearch}"></div>
      <div class="table-wrap" id="stuTableWrap"></div>
    </div>`;
  
  buildStudentForm();
  const tagWrap = document.getElementById('stuClassTags');
  tagWrap.innerHTML = ["সব",...CLASSES].map(c=>`<button data-c="${c}" class="${studentClassFilter===c?'active':''}">${c}</button>`).join("");
  tagWrap.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ studentClassFilter=b.dataset.c; renderStudents(); } });
  document.getElementById('stuSearch').addEventListener('input', e=>{ studentSearch=e.target.value; renderStudentTable(); });
  renderStudentTable();
}

function buildStudentForm(){
  const editing = editingStudentId ? getStudent(editingStudentId) : null;
  const f = document.getElementById('studentForm');
  f.innerHTML = `
    <label>নাম</label><input id="f_name" value="${editing?editing.name:''}" required>
    <div class="row2">
      <div><label>শ্রেণী</label><select id="f_class">${CLASSES.map(c=>`<option ${editing&&editing.class===c?'selected':''}>${c}</option>`).join("")}</select></div>
      <div><label>ফি (৳)</label><input id="f_fee" type="number" value="${editing?editing.fee:(db.classFees[CLASSES[0]]||800)}"></div>
    </div>
    <div class="row2">
      <div><label>অভিভাবক</label><input id="f_guardian" value="${editing?editing.guardian||'':''}"></div>
      <div><label>মোবাইল</label><input id="f_phone" value="${editing?editing.phone||'':''}"></div>
    </div>
    <div class="row2">
      <div><label>ভর্তির তারিখ</label><input id="f_admission" type="date" value="${editing?editing.admissionDate:todayStr()}"></div>
      <div><label>অবস্থা</label><select id="f_status"><option ${editing&&editing.status==='সক্রিয়'?'selected':''}>সক্রিয়</option><option ${editing&&editing.status==='নিষ্ক্রিয়'?'selected':''}>নিষ্ক্রিয়</option></select></div>
    </div>
    <button type="submit" class="btn">${editing?'হালনাগাদ':'যোগ করুন'}</button>
    ${editing?'<button type="button" class="btn secondary" onclick="editingStudentId=null;renderStudents()">বাতিল</button>':''}`;
  
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const data = {
      name: document.getElementById('f_name').value.trim(),
      class: document.getElementById('f_class').value,
      fee: Number(document.getElementById('f_fee').value||0),
      guardian: document.getElementById('f_guardian').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      admissionDate: document.getElementById('f_admission').value,
      status: document.getElementById('f_status').value
    };
    if(editing){ Object.assign(editing, data); editingStudentId=null; }
    else{ data.id = nextStudentId(data.class); db.students.push(data); }
    save(); toast("সংরক্ষিত হয়েছে"); renderStudents();
  });
}

function renderStudentTable(){
  const wrap = document.getElementById('stuTableWrap');
  const q = studentSearch.trim().toLowerCase();
  let list = db.students;
  if(studentClassFilter!=="সব") list = list.filter(s=>s.class===studentClassFilter);
  if(q) list = list.filter(s=>s.id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));
  if(list.length===0){ wrap.innerHTML = `<div class="empty">স্টুডেন্ট নেই</div>`; return; }
  wrap.innerHTML = `<table><tr><th>আইডি</th><th>নাম</th><th>শ্রেণী</th><th>বকেয়া</th><th></th></tr>
    ${list.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.class}</td><td>${studentDue(s)>0?`<span class="pill bad">${fmtMoney(studentDue(s))}</span>`:`<span class="pill ok">নেই</span>`}</td><td><button class="btn small secondary" onclick="openProfile('${s.id}')">প্রোফাইল</button></td></tr>`).join("")}
  </table>`;
}

let profileStudentId = null;
function openProfile(id){ profileStudentId = id; currentTab='studentProfile'; render(); }
function renderStudentProfile(){
  const app = document.getElementById('app');
  const s = getStudent(profileStudentId);
  if(!s) return;
  const history = studentPayments(s.id);
  app.innerHTML = `
    <button class="btn secondary no-print" onclick="showTab('students')">← ফিরে যান</button>
    <div class="card" style="margin-top:10px">
      <h2>${s.name} (${s.id})</h2>
      <div class="profile-grid">
        <div class="k">শ্রেণী:</div><div class="v">${s.class}</div>
        <div class="k">মোবাইল:</div><div class="v">${s.phone||'-'}</div>
        <div class="k">অভিভাবক:</div><div class="v">${s.guardian||'-'}</div>
        <div class="k">মাসিক ফি:</div><div class="v">${fmtMoney(s.fee)}</div>
        <div class="k">মোট বকেয়া:</div><div class="v" style="color:var(--danger)">${fmtMoney(Math.max(0,studentDue(s)))}</div>
      </div>
    </div>
    <div class="card">
      <h2>পেমেন্ট হিস্ট্রি</h2>
      <div class="table-wrap">
        ${history.length===0 ? '<div class="empty">কোনো পেমেন্ট তথ্য নেই</div>' : `<table><tr><th>তারিখ</th><th>মাস</th><th>পরিমাণ</th><th>রিসিট</th></tr>${history.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.forMonth}</td><td>${fmtMoney(p.amount)}</td><td><button class="btn small secondary" onclick="openReceipt('${p.id}')">রিসিট</button></td></tr>`).join("")}</table>`}
      </div>
    </div>`;
}

// ---------------- ATTENDANCE, EXAMS, STAFF, SETTINGS ----------------
function renderAttendance(){ document.getElementById('app').innerHTML = `<div class="card"><h2>উপস্থিতি রেজিস্টার</h2><p>উপস্থিতি তথ্য এন্ট্রি নিতে পারবেন।</p></div>`; }
function renderExams(){ document.getElementById('app').innerHTML = `<div class="card"><h2>পরীক্ষা ও রেজাল্ট</h2><p>পরীক্ষার নম্বর ইনপুট করতে পারবেন।</p></div>`; }
function renderStaff(){ document.getElementById('app').innerHTML = `<div class="card"><h2>স্টাফ ও বেতন</h2></div>`; }
function renderExpenses(){ document.getElementById('app').innerHTML = `<div class="card"><h2>অন্যান্য ব্যয়</h2></div>`; }
function renderSearch(){ document.getElementById('app').innerHTML = `<div class="card"><h2>সার্চ</h2></div>`; }

function renderSettings(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>প্রতিষ্ঠান সেটিংস</h2>
      <form id="setForm">
        <label>প্রতিষ্ঠানের নাম</label><input id="set_name" value="${db.meta.instituteName||''}">
        <label>মোবাইল</label><input id="set_phone" value="${db.meta.institutePhone||''}">
        <label>ঠিকানা</label><input id="set_addr" value="${db.meta.instituteAddress||''}">
        <button type="submit" class="btn">সংরক্ষণ করুন</button>
      </form>
    </div>
    <div class="card">
      <h2>ফায়ারবেস লাইভ সিঙ্ক</h2>
      <form id="fbForm">
        <label>Realtime Database URL</label><input id="fb_url" value="${db.meta.firebaseUrl||''}">
        <button type="submit" class="btn">সেভ করুন</button>
      </form>
    </div>`;

  document.getElementById('setForm').addEventListener('submit', e=>{
    e.preventDefault();
    db.meta.instituteName = document.getElementById('set_name').value;
    db.meta.institutePhone = document.getElementById('set_phone').value;
    db.meta.instituteAddress = document.getElementById('set_addr').value;
    save(); toast("সেটিংস সংরক্ষিত হয়েছে");
  });

  document.getElementById('fbForm').addEventListener('submit', e=>{
    e.preventDefault();
    db.meta.firebaseUrl = document.getElementById('fb_url').value.trim();
    save(); toast("সেটিংস সংরক্ষিত হয়েছে");
  });
}

render();
</script>
