<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>কোচিং ম্যানেজার</title>
<style>
  :root{
    --primary:#1F4E78; --primary-light:#2E6DA4; --accent:#2e7d32; --danger:#b02a2a; --warn:#b06a00;
    --bg:#f3f5f8; --card:#ffffff; --border:#e0e4ea; --text:#22303f; --muted:#6b7684;
    --yellow:#fff2cc; --green:#e2efda;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans Bengali','Nirmala UI','Kalpurush',sans-serif;
    padding-bottom:70px;
  }
  header{
    background:var(--primary); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:18px; margin:0;}
  header .sub{font-size:11px; opacity:.85;}
  nav.tabs{
    display:flex; overflow-x:auto; background:#173a5c; position:sticky; top:52px; z-index:19;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    flex:0 0 auto; background:none; border:none; color:#cfe0f0; padding:10px 14px;
    font-size:13px; font-family:inherit; white-space:nowrap; border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:#fff; border-bottom-color:#ffb703; font-weight:bold;}
  main{padding:12px; max-width:900px; margin:0 auto;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--primary);}
  .card h3.sub-h{font-size:13px; margin:14px 0 8px; color:var(--muted);}
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px;
    text-align:center;
  }
  .kpi .val{font-size:19px; font-weight:bold; color:var(--primary);}
  .kpi.profit .val{color:var(--accent);}
  .kpi.due .val{color:var(--danger);}
  .kpi .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select, textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary-light); border-color:var(--primary-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  button.btn{
    background:var(--primary); color:#fff; border:none; border-radius:7px; padding:10px 14px;
    font-size:14px; font-family:inherit; margin-top:10px; width:100%; cursor:pointer;
  }
  button.btn.secondary{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  button.btn.danger{background:var(--danger);}
  button.btn.small{width:auto; padding:6px 10px; font-size:12px; margin:0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:7px 6px; border-bottom:1px solid var(--border); text-align:right;}
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2){text-align:left;}
  th{background:#f0f3f7; color:var(--primary); font-size:12px;}
  .table-wrap{overflow-x:auto;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;}
  .pill.ok{background:var(--green); color:var(--accent);}
  .pill.warn{background:var(--yellow); color:#7a5b00;}
  .pill.bad{background:#fbe4e4; color:var(--danger);}
  .search-box{display:flex; gap:8px; margin-bottom:10px;}
  .search-box input{flex:1;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px;}
  .divider{height:1px; background:var(--border); margin:12px 0;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:13px;}
  .profile-grid .k{color:var(--muted);}
  .profile-grid .v{font-weight:bold;}
  .receipt{border:2px solid var(--primary); border-radius:10px; padding:18px; background:#fff;}
  .print-header{display:flex; align-items:center; gap:12px; margin-bottom:10px; border-bottom:2px solid var(--primary); padding-bottom:10px;}
  .print-header img{height:52px; width:52px; object-fit:contain; border-radius:8px;}
  .print-header .logo-fallback{
    height:52px; width:52px; border-radius:8px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px;
  }
  .print-header .pinfo{flex:1;}
  .print-header .pname{font-size:19px; font-weight:bold; color:var(--primary); margin:0;}
  .print-header .pmeta{font-size:11px; color:var(--muted);}
  .doc-title{text-align:center; font-size:13px; font-weight:bold; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .receipt table td{border:none; padding:4px 0;}
  .amount-box{
    text-align:center; font-size:22px; font-weight:bold; color:var(--accent);
    border:1px dashed var(--accent); border-radius:8px; padding:8px; margin:10px 0;
  }
  .sign-row{display:flex; justify-content:space-between; margin-top:36px; font-size:12px;}
  .sign-row div{border-top:1px solid #999; padding-top:4px; width:40%; text-align:center;}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .tag-row button{
    border:1px solid var(--border); background:#fff; border-radius:20px; padding:5px 12px;
    font-size:12px; font-family:inherit;
  }
  .tag-row button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .att-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .att-item{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1 1 45%;
    display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:6px;
  }
  .att-toggle{border:none; border-radius:20px; padding:5px 12px; font-size:12px; font-family:inherit; color:#fff; min-width:80px;}
  .att-toggle.present{background:var(--accent);}
  .att-toggle.absent{background:var(--danger);}
  .att-toggle.leave{background:var(--warn);}
  .subj-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .subj-row input{flex:1;}
  .subj-row input.full-inp{max-width:70px;}
  .subj-row input.obt-inp{max-width:70px;}
  .subj-row button{flex:0 0 auto; background:#fbe4e4; color:var(--danger); border:none; border-radius:6px; padding:6px 9px; font-size:12px;}
  .toast{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#222; color:#fff;
    padding:9px 16px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .3s;
  }
  .toast.show{opacity:1;}
  .seg{display:flex; border:1px solid var(--primary); border-radius:8px; overflow:hidden; margin-bottom:10px;}
  .seg button{flex:1; background:#fff; color:var(--primary); border:none; padding:8px; font-size:13px; font-family:inherit;}
  .seg button.active{background:var(--primary); color:#fff;}
  .day-head{background:#eef2f7; font-weight:bold; padding:6px 8px; font-size:12px; border-radius:6px; margin:10px 0 4px;}
  @media print{
    header, nav.tabs, .no-print{display:none !important;}
    main{padding:0;}
    body{padding:0;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>কোচিং ম্যানেজার</h1>
    <div class="sub" id="headerSub">সব ডেটা এই ফোনেই সংরক্ষিত থাকে</div>
  </div>
  <button class="btn small secondary no-print" style="width:auto;margin:0;" onclick="showTab('settings')">⚙ সেটিংস</button>
</header>

<nav class="tabs no-print" id="tabNav">
  <button data-tab="dashboard">ড্যাশবোর্ড</button>
  <button data-tab="students">স্টুডেন্ট</button>
  <button data-tab="payments">পেমেন্ট</button>
  <button data-tab="attendance">উপস্থিতি</button>
  <button data-tab="exams">পরীক্ষা</button>
  <button data-tab="reports">রিপোর্ট</button>
  <button data-tab="staff">স্টাফ ও বেতন</button>
  <button data-tab="expenses">অন্যান্য ব্যয়</button>
  <button data-tab="search">🔍 সার্চ</button>
  <button data-tab="summary">সারসংক্ষেপ</button>
</nav>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ================== CONSTANTS ================== */
const CLASSES = ["ষষ্ঠ শ্রেণী","সপ্তম শ্রেণী","অষ্টম শ্রেণী","নবম শ্রেণী","দশম শ্রেণী","একাদশ শ্রেণী","দ্বাদশ শ্রেণী"];
const CLASS_CODE = {"ষষ্ঠ শ্রেণী":"6","সপ্তম শ্রেণী":"7","অষ্টম শ্রেণী":"8","নবম শ্রেণী":"9","দশম শ্রেণী":"10","একাদশ শ্রেণী":"11","দ্বাদশ শ্রেণী":"12"};
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SUBJECTS = ["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","ধর্ম/আইসিটি","সমাজ/অন্যান্য"];
const PAY_METHODS = ["নগদ","বিকাশ","রকেট","ব্যাংক ট্রান্সফার"];
const EXP_CATS = ["ভাড়া","বিদ্যুৎ বিল","স্টেশনারি","ইন্টারনেট/ফোন","রক্ষণাবেক্ষণ","বিজ্ঞাপন","অন্যান্য"];
const EXAM_TYPES = ["ক্লাস টেস্ট","অধ্যায় ভিত্তিক টেস্ট","মাসিক টেস্ট","সারপ্রাইজ টেস্ট","মডেল টেস্ট"];
const EXAM_TYPE_EN = {"ক্লাস টেস্ট":"Class Test","অধ্যায় ভিত্তিক টেস্ট":"Chapter Test","মাসিক টেস্ট":"Monthly Test","সারপ্রাইজ টেস্ট":"Surprise Test","মডেল টেস্ট":"Model Test"};
const SUBJECT_TEMPLATES = {
  "ক্লাস টেস্ট": [{name:"",cqFull:10,mcqFull:0},{name:"",cqFull:10,mcqFull:0},{name:"",cqFull:10,mcqFull:0}],
  "অধ্যায় ভিত্তিক টেস্ট": [{name:"",cqFull:20,mcqFull:5}],
  "মাসিক টেস্ট": SUBJECTS.map(s=>({name:s, cqFull:70, mcqFull:30})),
  "সারপ্রাইজ টেস্ট": [{name:"",cqFull:20,mcqFull:0}],
  "মডেল টেস্ট": SUBJECTS.map(s=>({name:s, cqFull:70, mcqFull:30}))
};
const STORE_KEY = "coachingAppData_v2";

/* ================== DATA LAYER ================== */
function defaultDB(){
  const classFees = {};
  CLASSES.forEach(c=>classFees[c]=800);
  return {
    meta:{
      classSeq:{}, receiptSeq:0, staffSeq:0, expenseSeq:0, examSeq:0,
      instituteName:"Educare Coaching", institutePhone:"01717046168",
      instituteAddress:"Gobindaganj, Gaibandha", logoDataUrl:null,
      lastBackupDate:null, firebaseUrl:"", firebasePath:"coaching_data", updatedAt:0
    },
    classFees,
    settings:{
      payMethods:[...PAY_METHODS],
      expCats:[...EXP_CATS],
      examTypes:[...EXAM_TYPES],
      subjectTemplates: JSON.parse(JSON.stringify(SUBJECT_TEMPLATES)),
      gradeScale:[{min:80,label:"A+"},{min:70,label:"A"},{min:60,label:"A-"},{min:50,label:"B"},{min:40,label:"C"},{min:0,label:"F"}]
    },
    students:[], payments:[], attendance:[], exams:[], staff:[], staffPayments:[], expenses:[]
  };
}
function migrate(data){
  const base = defaultDB();
  const d = Object.assign(base, data);
  d.meta = Object.assign(defaultDB().meta, data.meta||{});
  d.classFees = Object.assign(defaultDB().classFees, data.classFees||{});
  const defSettings = defaultDB().settings;
  d.settings = Object.assign({}, defSettings, data.settings||{});
  d.settings.subjectTemplates = Object.assign({}, defSettings.subjectTemplates, (data.settings||{}).subjectTemplates||{});
  (d.exams||[]).forEach(ex=>{
    if(ex.marks && !ex.subjects){
      ex.subjects = SUBJECTS.map(s=>({name:s, cqFull:100, mcqFull:0, cqObtained:Number(ex.marks[s]||0), mcqObtained:0}));
      ex.type = ex.type || "মাসিক টেস্ট";
      delete ex.marks;
    }
    (ex.subjects||[]).forEach(sub=>{
      if(sub.cqFull===undefined){
        sub.cqFull = Number(sub.full||0);
        sub.mcqFull = 0;
        sub.cqObtained = Number(sub.obtained||0);
        sub.mcqObtained = 0;
        delete sub.full; delete sub.obtained;
      }
    });
  });
  return d;
}
let db = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return defaultDB();
}
function save(){
  db.meta.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
  pushToCloud();
}
/* ================== FIREBASE LIVE SYNC ================== */
let syncState = "off"; // off, synced, offline, syncing
function setSyncState(s){
  syncState = s;
  const el = document.getElementById('syncIndicator');
  if(el) el.textContent = syncLabel();
}
function syncLabel(){
  if(!db.meta.firebaseUrl) return "";
  if(syncState==="synced") return "🟢 লাইভ সিঙ্ক চালু";
  if(syncState==="syncing") return "🔄 সিঙ্ক হচ্ছে...";
  if(syncState==="offline") return "⚪ অফলাইন (স্থানীয়ভাবে সংরক্ষিত)";
  return "";
}
function cloudUrl(){
  if(!db.meta.firebaseUrl) return null;
  const base = db.meta.firebaseUrl.replace(/\/$/,"");
  const path = (db.meta.firebasePath||"coaching_data").replace(/^\/|\/$/g,"");
  return `${base}/${path}.json`;
}
async function pushToCloud(){
  const url = cloudUrl();
  if(!url) return;
  setSyncState("syncing");
  try{
    await fetch(url, { method:'PUT', body: JSON.stringify(db) });
    setSyncState("synced");
  }catch(e){ setSyncState("offline"); }
}
async function pullFromCloud(){
  const url = cloudUrl();
  if(!url) return null;
  const res = await fetch(url);
  if(!res.ok) throw new Error('fetch failed');
  return await res.json();
}
async function checkCloudForUpdates(){
  if(!db.meta.firebaseUrl) return;
  const active = document.activeElement;
  const tag = active && active.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  try{
    const remote = await pullFromCloud();
    if(remote && remote.meta && Number(remote.meta.updatedAt||0) > Number(db.meta.updatedAt||0)){
      db = migrate(remote);
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
      setSyncState("synced");
      render();
      toast("অন্য ডিভাইস থেকে নতুন তথ্য এসেছে");
    } else {
      setSyncState("synced");
    }
  }catch(e){ setSyncState("offline"); }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function pad(n,len){ return String(n).padStart(len,"0"); }
function nextStudentId(cls){
  db.meta.classSeq[cls] = (db.meta.classSeq[cls]||0)+1;
  return `${CLASS_CODE[cls]}-${pad(db.meta.classSeq[cls],3)}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return "৳" + Math.round(n||0).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function monthNameFromDate(d){ if(!d) return ""; return MONTHS[new Date(d).getMonth()]; }
function yearFromDate(d){ if(!d) return null; return new Date(d).getFullYear(); }

/* ================== DERIVED CALCS ================== */
function studentPayments(id){ return db.payments.filter(p=>p.studentId===id); }
function studentTotalPaid(id){ return studentPayments(id).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentExpectedTotal(st){
  if(!st.admissionDate) return 0;
  const adm = new Date(st.admissionDate); const now = new Date();
  let months = (now.getFullYear()-adm.getFullYear())*12 + (now.getMonth()-adm.getMonth()) + 1;
  if(months<0) months=0;
  return months * Number(st.fee||0);
}
function studentDue(st){ return studentExpectedTotal(st) - studentTotalPaid(st.id); }
function studentAttendancePct(id){
  const recs = db.attendance.filter(a=>a.studentId===id);
  if(recs.length===0) return null;
  const present = recs.filter(a=>a.status==="উপস্থিত").length;
  return Math.round((present/recs.length)*100);
}
function studentLastPayment(id){
  const p = studentPayments(id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  return p ? p.date : null;
}
function getStudent(id){ return db.students.find(s=>s.id===id); }
function activeStudents(cls){
  let list = db.students.filter(s=>s.status!=="নিষ্ক্রিয়");
  if(cls && cls!=="সব") list = list.filter(s=>s.class===cls);
  return list;
}
function gradeFromPct(pct){
  const scale = [...db.settings.gradeScale].sort((a,b)=>b.min-a.min);
  for(const g of scale){ if(pct>=g.min) return g.label; }
  return scale.length ? scale[scale.length-1].label : "-";
}
function subjectTemplateFor(type){
  const t = db.settings.subjectTemplates[type];
  return t ? JSON.parse(JSON.stringify(t)) : [{name:"",cqFull:100,mcqFull:0}];
}
function subCqObtained(sub){ return Number(sub.cqObtained||0); }
function subMcqObtained(sub){ return Number(sub.mcqObtained||0); }
function subTotal(sub){ return subCqObtained(sub)+subMcqObtained(sub); }
function subFull(sub){ return Number(sub.cqFull||0)+Number(sub.mcqFull||0); }
function examTotal(ex){ return (ex.subjects||[]).reduce((s,sub)=>s+subTotal(sub),0); }
function examFull(ex){ return (ex.subjects||[]).reduce((s,sub)=>s+subFull(sub),0); }
function examPct(ex){ const f=examFull(ex); return f>0 ? Math.round((examTotal(ex)/f)*1000)/10 : 0; }

function paymentsFiltered(cls, year){
  let list = db.payments;
  if(cls && cls!=="সব") list = list.filter(p=>{ const s=getStudent(p.studentId); return s && s.class===cls; });
  if(year) list = list.filter(p=>yearFromDate(p.date)===year);
  return list;
}
function monthlyIncome(month, year, cls){
  return paymentsFiltered(cls, year).filter(p=>monthNameFromDate(p.date)===month)
    .reduce((s,p)=>s+Number(p.amount||0),0);
}
function monthlySalaryExpense(month, year){
  return db.staffPayments.filter(p=>p.month===month && (!year || yearFromDate(p.date)===year))
    .reduce((s,p)=>s+Number(p.amount||0),0);
}
function monthlyOtherExpense(month, year){
  return db.expenses.filter(e=>e.month===month && (!year || yearFromDate(e.date)===year))
    .reduce((s,e)=>s+Number(e.amount||0),0);
}
function getYearsList(){
  const years = new Set([new Date().getFullYear()]);
  db.payments.forEach(p=>years.add(yearFromDate(p.date)));
  db.staffPayments.forEach(p=>years.add(yearFromDate(p.date)));
  db.expenses.forEach(e=>years.add(yearFromDate(e.date)));
  return Array.from(years).filter(Boolean).sort((a,b)=>b-a);
}

/* ================== PRINT HEADER ================== */
function printHeaderHtml(docTitle){
  const m = db.meta;
  const logo = m.logoDataUrl
    ? `<img src="${m.logoDataUrl}" alt="logo">`
    : `<div class="logo-fallback">${(m.instituteName||"EC").slice(0,2).toUpperCase()}</div>`;
  return `
    <div class="print-header">
      ${logo}
      <div class="pinfo">
        <div class="pname">${m.instituteName||""}</div>
        <div class="pmeta">${m.instituteAddress||""}${m.instituteAddress&&m.institutePhone?' · ':''}${m.institutePhone?('Phone: '+m.institutePhone):''}</div>
      </div>
    </div>

let currentTab = 'dashboard';
document.getElementById('tabNav').addEventListener('click', e=>{

  if(b) showTab(b.dataset.tab);
});
function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
  window.scrollTo(0,0);
}
function render(){
  const app = document.getElementById('app');
  const fns = {
    dashboard: renderDashboard, students: renderStudents, payments: renderPayments,
    attendance: renderAttendance, exams: renderExams, reports: renderReports, staff: renderStaff,
    expenses: renderExpenses, summary: renderSummary, settings: renderSettings, search: renderSearch,
    studentProfile: renderStudentProfile, receipt: renderReceipt, reportCard: renderReportCard,
    classResult: renderClassResult
  };
  app.innerHTML = "";
  try{
    (fns[currentTab]||renderDashboard)();

    console.error('Render error on tab', currentTab, err);
    app.innerHTML = `<div class="card"><div class="empty">এই অংশ লোড করতে সমস্যা হয়েছে। উপরের অন্য একটি ট্যাবে চেপে আবার চেষ্টা করুন। আপনার ডেটা নিরাপদ আছে।</div></div>`;

function renderDashboard(){
  const app = document.getElementById('app');
  const now = new Date();
  const curMonth = MONTHS[now.getMonth()];
  const curYear = now.getFullYear();
  const income = monthlyIncome(curMonth, curYear);
  const salExp = monthlySalaryExpense(curMonth, curYear);
  const otherExp = monthlyOtherExpense(curMonth, curYear);
  const profit = income - salExp - otherExp;
  const totalDue = activeStudents().reduce((s,st)=>s+Math.max(0,studentDue(st)),0);
  const today = todayStr();
  const todayAtt = db.attendance.filter(a=>a.date===today);
  const todayPresent = todayAtt.filter(a=>a.status==="উপস্থিত").length;

  app.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="val">${activeStudents().length}</div><div class="lbl">সক্রিয় স্টুডেন্ট</div></div>
      <div class="kpi"><div class="val">${todayAtt.length?`${todayPresent}/${todayAtt.length}`:'-'}</div><div class="lbl">আজকের উপস্থিতি</div></div>
      <div class="kpi"><div class="val">${fmtMoney(income)}</div><div class="lbl">${curMonth} মাসের আয়</div></div>
      <div class="kpi"><div class="val">${fmtMoney(salExp+otherExp)}</div><div class="lbl">${curMonth} মাসের ব্যয়</div></div>
      <div class="kpi profit"><div class="val">${fmtMoney(profit)}</div><div class="lbl">${curMonth} মাসের মুনাফা</div></div>
      <div class="kpi due"><div class="val">${fmtMoney(totalDue)}</div><div class="lbl">মোট বকেয়া</div></div>
    </div>
    <div class="card">
      <h2>মাস অনুযায়ী আয়-ব্যয়-মুনাফা (${curYear})</h2>
      <div class="table-wrap"><table>
        <tr><th>মাস</th><th>আয়</th><th>ব্যয়</th><th>মুনাফা</th></tr>
        ${MONTHS.map(m=>{
          const inc=monthlyIncome(m,curYear), exp=monthlySalaryExpense(m,curYear)+monthlyOtherExpense(m,curYear), pr=inc-exp;
          return `<tr><td>${m}</td><td>${fmtMoney(inc)}</td><td>${fmtMoney(exp)}</td><td style="color:${pr>=0?'var(--accent)':'var(--danger)'}">${fmtMoney(pr)}</td></tr>`;
        }).join("")}
      </table></div>
    </div>
    <div class="card">
      <h2>সবচেয়ে বেশি বকেয়া (টপ ৫)</h2>
      ${topDueList()}
    </div>
  `;
}
function topDueList(){
  const list = activeStudents().map(s=>({s, due: studentDue(s)}))
    .filter(x=>x.due>0).sort((a,b)=>b.due-a.due).slice(0,5);
  if(list.length===0) return `<div class="empty">কোনো বকেয়া নেই 🎉</div>`;
  return `<div class="table-wrap"><table><tr><th>নাম</th><th>শ্রেণী</th><th>বকেয়া</th></tr>
    ${list.map(x=>`<tr><td>${x.s.name}</td><td>${x.s.class}</td><td style="color:var(--danger)">${fmtMoney(x.due)}</td></tr>`).join("")}
  </table></div>`;
}

function renderPayHistory(){
  const wrap = document.getElementById('payHistWrap');
  const list = paymentsFiltered(paymentClassFilter).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(list.length===0){ wrap.innerHTML = `<div class="empty">কোনো পেমেন্ট নেই</div>`; return; }
  if(paymentViewMode==="মাসিক"){
    const years = Array.from(new Set(list.map(p=>yearFromDate(p.date)))).sort((a,b)=>b-a);
    let html = "";
    years.forEach(y=>{
      html += `<div class="day-head">${y}</div><table><tr><th>মাস</th><th>মোট আয়</th><th>লেনদেন</th></tr>`;
      MONTHS.forEach(m=>{
        const rows = list.filter(p=>yearFromDate(p.date)===y && monthNameFromDate(p.date)===m);
        if(rows.length===0) return;
        const tot = rows.reduce((s,p)=>s+Number(p.amount||0),0);
        html += `<tr><td>${m}</td><td>${fmtMoney(tot)}</td><td>${rows.length}</td></tr>`;
      });
      html += `</table>`;
    });
    wrap.innerHTML = html;
  } else {
    const dates = Array.from(new Set(list.map(p=>p.date))).sort((a,b)=>new Date(b)-new Date(a));
    let html = "";
    dates.forEach(d=>{
      const rows = list.filter(p=>p.date===d);
      const tot = rows.reduce((s,p)=>s+Number(p.amount||0),0);
      html += `<div class="day-head">${fmtDate(d)} — মোট ${fmtMoney(tot)}</div><table>`;
      rows.forEach(p=>{
        const s = getStudent(p.studentId);
        html += `<tr><td>${s?s.name:p.studentId}</td><td>${p.forMonth}</td><td>${fmtMoney(p.amount)}</td>
          <td><button class="btn small secondary" onclick="openReceipt('${p.id}')">রিসিট</button></td></tr>`;
      });
      html += `</table>`;
    });
    wrap.innerHTML = html;
  }
}

function renderAttendance(){
  const app = document.getElementById('app');
  app.innerHTML = `

      <div id="absentList"></div>
    </div>
  `;
  document.getElementById('att_date').addEventListener('change', e=>{ attDate=e.target.value; attWorking={}; renderAttList(); renderAbsentList(); });
  document.getElementById('att_class').addEventListener('change', e=>{ attClass=e.target.value; attWorking={}; renderAttList(); });
  renderAttList();
  renderAbsentList();
  document.getElementById('saveAttBtn').addEventListener('click', saveAttendance);
}
function renderAttList(){
  const wrap = document.getElementById('attList');
  const list = db.students.filter(s=>s.class===attClass && s.status!=="নিষ্ক্রিয়");
  if(list.length===0){ wrap.innerHTML = `<div class="empty">এই শ্রেণীতে কোনো স্টুডেন্ট নেই</div>`; return; }
  list.forEach(s=>{
    if(attWorking[s.id]===undefined){
      const existing = db.attendance.find(a=>a.studentId===s.id && a.date===attDate);
      attWorking[s.id] = existing ? existing.status : "উপস্থিত";
    }
  });
  function pillClass(st){ return st==="উপস্থিত"?"present":(st==="অনুপস্থিত"?"absent":"leave"); }
  wrap.innerHTML = `<div class="att-grid">${list.map(s=>`
    <div class="att-item">
      <span>${s.name}</span>
      <button type="button" class="att-toggle ${pillClass(attWorking[s.id])}" data-sid="${s.id}">${attWorking[s.id]}</button>
    </div>`).join("")}</div>`;
  const cycle = {"উপস্থিত":"অনুপস্থিত","অনুপস্থিত":"ছুটি","ছুটি":"উপস্থিত"};
  wrap.querySelectorAll('.att-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid = btn.dataset.sid;
      attWorking[sid] = cycle[attWorking[sid]];
      btn.textContent = attWorking[sid];
      btn.className = "att-toggle " + pillClass(attWorking[sid]);
      updateAttSummary();
    });
  });
  updateAttSummary();
}
function updateAttSummary(){
  const vals = Object.values(attWorking);
  const present = vals.filter(v=>v==="উপস্থিত").length;
  const absent = vals.filter(v=>v==="অনুপস্থিত").length;
  const leave = vals.filter(v=>v==="ছুটি").length;
  document.getElementById('attSummary').textContent = `মোট ${vals.length} জন — উপস্থিত ${present}, অনুপস্থিত ${absent}, ছুটি ${leave}`;
}
function saveAttendance(){
  Object.keys(attWorking).forEach(sid=>{
    let rec = db.attendance.find(a=>a.studentId===sid && a.date===attDate);
    if(!rec){ rec = {studentId:sid, date:attDate, status:attWorking[sid]}; db.attendance.push(rec); }
    else rec.status = attWorking[sid];
  });
  save();
  toast("উপস্থিতি সংরক্ষণ হয়েছে");
  renderAbsentList();
  toast("উপস্থিতি সংরক্ষণ হয়েছে");
}
function renderAbsentList(){
  const wrap = document.getElementById('absentList');
  const recs = db.attendance.filter(a=>a.date===attDate && a.status!=="উপস্থিত");
  if(recs.length===0){ wrap.innerHTML = `<div class="empty">এই তারিখে কোনো অনুপস্থিতি রেকর্ড নেই (অথবা সবাই উপস্থিত)</div>`; return; }
  const byClass = {};
  recs.forEach(r=>{
    const s = getStudent(r.studentId); if(!s) return;
    byClass[s.class] = byClass[s.class]||[];
    byClass[s.class].push({name:s.name, status:r.status});
  });
  wrap.innerHTML = Object.keys(byClass).map(c=>`
    <div class="day-head">${c}</div>
    <table>${byClass[c].map(x=>`<tr><td>${x.name}</td><td><span class="pill ${x.status==='অনুপস্থিত'?'bad':'warn'}">${x.status}</span></td></tr>`).join("")}</table>
  `).join("");
}

function bindSubjIndEvents(){

  wrap.querySelectorAll('.cqfull-inp').forEach(inp=>{

let reportPeriod = "দৈনিক"; // দৈনিক, সাপ্তাহিক, মাসিক, বাৎসরিক, কাস্টম

let reportYearSel = new Date().getFullYear();

function getReportRange(){
  if(reportPeriod==="দৈনিক") return [reportDate, reportDate];
  if(reportPeriod==="সাপ্তাহিক"){
    const start = new Date(reportWeekStart);
    const end = new Date(start); end.setDate(end.getDate()+6);
    return [reportWeekStart, end.toISOString().slice(0,10)];
  }
  if(reportPeriod==="মাসিক"){
    const mi = MONTHS.indexOf(reportMonthSel);
    const start = new Date(reportYearForMonth, mi, 1);
    const end = new Date(reportYearForMonth, mi+1, 0);
    return [start.toISOString().slice(0,10), end.toISOString().slice(0,10)];
  }
  if(reportPeriod==="বাৎসরিক") return [`${reportYearSel}-01-01`, `${reportYearSel}-12-31`];
  return [reportCustomFrom, reportCustomTo];
}
function datesInRange(start,end){
  const arr=[]; let d=new Date(start); const e=new Date(end);
  while(d<=e){ arr.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return arr;
}
function reportClassScope(){ return reportClassFilter==="সব" ? CLASSES : [reportClassFilter]; }
function studentAttendancePctInRange(id, dates){
  const recs = db.attendance.filter(a=>a.studentId===id && dates.includes(a.date));
  if(recs.length===0) return null;
  const present = recs.filter(a=>a.status==="উপস্থিত").length;
  return Math.round((present/recs.length)*100);
}

function renderReportBody(){
  const wrap = document.getElementById('repBody');

  let body = "";
  if(reportType==="সম্পূর্ণ") body = fullSummaryReportHtml(dates, periodLabel);
  else if(reportType==="রেজাল্ট") body = resultReportHtml(dates, periodLabel, clsLabel);
  else if(reportType==="উপস্থিতি") body = attendanceReportHtml(dates, periodLabel, clsLabel);
  else if(reportType==="পেমেন্ট") body = paymentReportHtml(dates, periodLabel, clsLabel);
  else if(reportType==="ভর্তি/অব্যাহতি") body = enrollmentReportHtml(dates, periodLabel, clsLabel);
  wrap.innerHTML = `<div class="receipt" style="margin-top:12px">${body}</div>`;

function fullSummaryReportHtml(dates, periodLabel){
  const pays = db.payments.filter(p=>dates.includes(p.date));
  const income = pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const salExp = db.staffPayments.filter(p=>dates.includes(p.date)).reduce((s,p)=>s+Number(p.amount||0),0);
  const otherExp = db.expenses.filter(e=>dates.includes(e.date)).reduce((s,e)=>s+Number(e.amount||0),0);
  const totalExp = salExp+otherExp, profit = income-totalExp;
  const attRows = db.attendance.filter(a=>dates.includes(a.date));
  const classAttendance = CLASSES.map(c=>{
    const studIds = new Set(db.students.filter(s=>s.class===c).map(s=>s.id));
    const rows = attRows.filter(a=>studIds.has(a.studentId));
    return {c, present:rows.filter(a=>a.status==="উপস্থিত").length, absent:rows.filter(a=>a.status==="অনুপস্থিত").length, leave:rows.filter(a=>a.status==="ছুটি").length, total:rows.length};
  }).filter(x=>x.total>0);
  const examRows = db.exams.filter(e=>dates.includes(e.date));
  let bestResult = null;
  examRows.forEach(e=>{ const pct=examPct(e); if(!bestResult||pct>bestResult.pct) bestResult={ex:e,pct}; });
  const newAdm = db.students.filter(s=>s.admissionDate && dates.includes(s.admissionDate));
  const left = db.students.filter(s=>s.status==="নিষ্ক্রিয়" && s.leftDate && dates.includes(s.leftDate));
  return `
    ${printHeaderHtml("Summary Report — " + periodLabel)}
    <h3 class="sub-h">Income / Expense / Profit</h3>
    <table style="width:100%">
      <tr><td>Total Income</td><td style="text-align:right">${fmtMoney(income)}</td></tr>
      <tr><td>Salary Expense</td><td style="text-align:right">${fmtMoney(salExp)}</td></tr>
      <tr><td>Other Expense</td><td style="text-align:right">${fmtMoney(otherExp)}</td></tr>
      <tr><td>Total Expense</td><td style="text-align:right">${fmtMoney(totalExp)}</td></tr>
      <tr style="font-weight:bold"><td>Profit</td><td style="text-align:right;color:${profit>=0?'var(--accent)':'var(--danger)'}">${fmtMoney(profit)}</td></tr>
    </table>
    <h3 class="sub-h">Attendance by Class</h3>
    ${classAttendance.length===0?'<div class="empty">No attendance records</div>':`<div class="table-wrap"><table>
      <tr><th>Class</th><th>Present</th><th>Absent</th><th>Leave</th><th>Total</th></tr>
      ${classAttendance.map(x=>`<tr><td>${x.c}</td><td style="text-align:right">${x.present}</td><td style="text-align:right">${x.absent}</td><td style="text-align:right">${x.leave}</td><td style="text-align:right">${x.total}</td></tr>`).join("")}
    </table></div>`}
    <h3 class="sub-h">Exams</h3>
    <table style="width:100%"><tr><td>Total Exam Entries</td><td style="text-align:right">${examRows.length}</td></tr></table>
    ${bestResult?`<div class="amount-box">Best Result: ${(getStudent(bestResult.ex.studentId)||{}).name||'-'} — ${bestResult.pct}%</div>`:''}
    <h3 class="sub-h">Enrollment</h3>
    <table style="width:100%">
      <tr><td>New Admissions</td><td style="text-align:right">${newAdm.length}</td></tr>
      <tr><td>Left / Dropped</td><td style="text-align:right">${left.length}</td></tr>

function resultReportHtml(dates, periodLabel, clsLabel){
  const classes = reportClassScope();
  const typeLabel = reportExamTypeFilter==="সব" ? "All Types" : (EXAM_TYPE_EN[reportExamTypeFilter]||reportExamTypeFilter);
  let html = printHeaderHtml("Result Report — " + clsLabel + " — " + typeLabel + " — " + periodLabel);
  classes.forEach(cls=>{
    const students = db.students.filter(s=>s.class===cls);
    const rows = students.map(s=>{
      const exs = db.exams.filter(e=>e.studentId===s.id && dates.includes(e.date) && (reportExamTypeFilter==="সব"||e.type===reportExamTypeFilter));
      const avgPct = exs.length ? Math.round(exs.reduce((sum,e)=>sum+examPct(e),0)/exs.length*10)/10 : null;
      const attPct = studentAttendancePctInRange(s.id, dates);
      return {s, avgPct, attPct, examCount:exs.length};
    }).filter(r=>r.examCount>0 || r.attPct!==null)
      .sort((a,b)=>(b.avgPct??-1)-(a.avgPct??-1));
    if(rows.length===0) return;
    const shown = reportDetail==="সংক্ষিপ্ত" ? rows.slice(0,3) : rows;
    html += `<h3 class="sub-h">${cls}</h3>
      <div class="table-wrap"><table>
        <tr><th>Rank</th><th>Name</th><th>ID</th><th>Avg Exam %</th><th>Attendance %</th><th>Exams</th></tr>
        ${shown.map((r,i)=>`<tr><td>${i+1}</td><td>${r.s.name}</td><td>${r.s.id}</td>
          <td style="text-align:right">${r.avgPct===null?'-':r.avgPct+'%'}</td>
          <td style="text-align:right">${r.attPct===null?'-':r.attPct+'%'}</td>
          <td style="text-align:right">${r.examCount}</td></tr>`).join("")}
      </table></div>`;
  });
  return html;
}

function attendanceReportHtml(dates, periodLabel, clsLabel){
  const classes = reportClassScope();
  let html = printHeaderHtml("Attendance Report — " + clsLabel + " — " + periodLabel);
  const attRows = db.attendance.filter(a=>dates.includes(a.date));
  classes.forEach(cls=>{
    const studIds = new Set(db.students.filter(s=>s.class===cls).map(s=>s.id));
    const rows = attRows.filter(a=>studIds.has(a.studentId));
    if(rows.length===0) return;
    const present = rows.filter(a=>a.status==="উপস্থিত").length;
    const absent = rows.filter(a=>a.status==="অনুপস্থিত").length;
    const leave = rows.filter(a=>a.status==="ছুটি").length;
    html += `<h3 class="sub-h">${cls}</h3>
      <table style="width:100%">
        <tr><td>Present</td><td style="text-align:right">${present}</td></tr>
        <tr><td>Absent</td><td style="text-align:right">${absent}</td></tr>
        <tr><td>Leave</td><td style="text-align:right">${leave}</td></tr>
        <tr style="font-weight:bold"><td>Total Marked</td><td style="text-align:right">${rows.length}</td></tr>
      </table>`;
    if(reportDetail==="বিস্তারিত"){
      const absentRows = rows.filter(a=>a.status!=="উপস্থিত");
      if(absentRows.length===0){
        html += `<div class="empty">No absences 🎉</div>`;
      } else {
        html += `<div class="table-wrap"><table>
          <tr><th>Name</th><th>Date</th><th>Status</th><th>Student Phone</th><th>Guardian</th><th>Guardian Phone</th></tr>
          ${absentRows.map(a=>{
            const s = getStudent(a.studentId)||{};
            return `<tr><td>${s.name||'-'}</td><td>${fmtDate(a.date)}</td><td>${a.status}</td><td>${s.phone||'-'}</td><td>${s.guardian||'-'}</td><td>${s.whatsapp||s.phone||'-'}</td></tr>`;
          }).join("")}
        </table></div>`;
      }
    }
  });
  return html;
}

function paymentReportHtml(dates, periodLabel, clsLabel){
  const classes = reportClassScope();
  const classSet = new Set(classes);
  const pays = db.payments.filter(p=>{
    const s=getStudent(p.studentId); return s && classSet.has(s.class) && dates.includes(p.date);
  });
  const income = pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const paidIds = new Set(pays.map(p=>p.studentId));
  const scope = db.students.filter(s=>classSet.has(s.class) && s.status!=="নিষ্ক্রিয়");
  const notPaid = scope.filter(s=>!paidIds.has(s.id));
  const salPays = db.staffPayments.filter(p=>dates.includes(p.date));
  const salExp = salPays.reduce((s,p)=>s+Number(p.amount||0),0);
  const otherExpRows = db.expenses.filter(e=>dates.includes(e.date));
  const otherExp = otherExpRows.reduce((s,e)=>s+Number(e.amount||0),0);
  const totalExp = salExp+otherExp;
  const profit = income-totalExp;
  let html = `${printHeaderHtml("Payment Report — " + clsLabel + " — " + periodLabel)}
    <h3 class="sub-h">Income</h3>
    <table style="width:100%">
      <tr><td>Total Collected</td><td style="text-align:right">${fmtMoney(income)}</td></tr>
      <tr><td>Students Paid</td><td style="text-align:right">${paidIds.size}</td></tr>
      <tr><td>Students Not Paid (in this period)</td><td style="text-align:right">${notPaid.length}</td></tr>
    </table>
    <h3 class="sub-h">Expense</h3>
    <table style="width:100%">
      <tr><td>Salary Expense</td><td style="text-align:right">${fmtMoney(salExp)}</td></tr>
      <tr><td>Other Expense</td><td style="text-align:right">${fmtMoney(otherExp)}</td></tr>
      <tr style="font-weight:bold"><td>Total Expense</td><td style="text-align:right">${fmtMoney(totalExp)}</td></tr>
    </table>
    <div class="amount-box" style="color:${profit>=0?'var(--accent)':'var(--danger)'}">Net Profit: ${fmtMoney(profit)}</div>`;
  if(reportDetail==="বিস্তারিত"){
    html += `<h3 class="sub-h">Paid</h3>`;
    html += pays.length===0 ? `<div class="empty">No payments</div>` : `<div class="table-wrap"><table>
      <tr><th>Name</th><th>Class</th><th>Date</th><th>Amount</th><th>Method</th></tr>
      ${pays.map(p=>{ const s=getStudent(p.studentId)||{}; return `<tr><td>${s.name||'-'}</td><td>${s.class||'-'}</td><td>${fmtDate(p.date)}</td><td style="text-align:right">${fmtMoney(p.amount)}</td><td>${p.method}</td></tr>`; }).join("")}
    </table></div>`;
    html += `<h3 class="sub-h">Not Paid</h3>`;
    html += notPaid.length===0 ? `<div class="empty">Everyone has paid 🎉</div>` : `<div class="table-wrap"><table>
      <tr><th>Name</th><th>Class</th><th>Guardian</th><th>Phone</th></tr>
      ${notPaid.map(s=>`<tr><td>${s.name}</td><td>${s.class}</td><td>${s.guardian||'-'}</td><td>${s.phone||'-'}</td></tr>`).join("")}
    </table></div>`;
    html += `<h3 class="sub-h">Salary Payments</h3>`;
    html += salPays.length===0 ? `<div class="empty">None</div>` : `<div class="table-wrap"><table>
      <tr><th>Staff</th><th>Date</th><th>Amount</th></tr>
      ${salPays.map(p=>{ const st=db.staff.find(x=>x.id===p.staffId)||{}; return `<tr><td>${st.name||'-'}</td><td>${fmtDate(p.date)}</td><td style="text-align:right">${fmtMoney(p.amount)}</td></tr>`; }).join("")}
    </table></div>`;
    html += `<h3 class="sub-h">Other Expenses</h3>`;
    html += otherExpRows.length===0 ? `<div class="empty">None</div>` : `<div class="table-wrap"><table>
      <tr><th>Category</th><th>Description</th><th>Date</th><th>Amount</th></tr>
      ${otherExpRows.map(e=>`<tr><td>${e.category}</td><td>${e.description||'-'}</td><td>${fmtDate(e.date)}</td><td style="text-align:right">${fmtMoney(e.amount)}</td></tr>`).join("")}
    </table></div>`;
  }
  return html;
}

      <div class="tag-row" id="listExpCats"></div>
      <div class="row2"><input id="newExpCat" placeholder="যেমন: পরিবহন খরচ"><button class="btn secondary" id="addExpCatBtn" style="margin-top:0">+ যোগ করুন</button></div>
      <h3 class="sub-h">পরীক্ষার ধরন</h3>
      <div class="tag-row" id="listExamTypes"></div>
      <div class="row2"><input id="newExamType" placeholder="যেমন: টার্ম ফাইনাল"><button class="btn secondary" id="addExamTypeBtn" style="margin-top:0">+ যোগ করুন</button></div>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 0">নতুন ধরন যোগ করলে শুরুতে ৩টি সাধারণ বিষয় (পূর্ণমান ১০০) থাকবে। পরীক্ষা ফর্মে গিয়ে বিষয়/পূর্ণমান বদলে "ডিফল্ট হিসেবে সংরক্ষণ করুন" চাপলেই ভবিষ্যতের জন্য সেভ হয়ে যাবে।</p>
    </div>
    <div class="card">
      <h2>লাইভ সিঙ্ক ও একাধিক ডিভাইস <span id="syncIndicator" style="font-size:11px;font-weight:normal;color:var(--muted)"></span></h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 6px">
        একবার সেটআপ করলে এক ডিভাইসে কিছু সেভ করলে অন্য ডিভাইসে ~১৫ সেকেন্ডের মধ্যে আপনা-আপনি দেখা যাবে। দুই ডিভাইসে ঠিক একই মুহূর্তে এন্ট্রি দিলে যেটা শেষে সেভ হবে সেটাই থাকবে।
      </p>
      <label>Firebase Database URL</label>
      <input id="fb_url" value="${m.firebaseUrl||''}" placeholder="https://your-project-default-rtdb.firebaseio.com">
      <label>গোপন পাথ (এলোমেলো শব্দ, কাউকে শেয়ার করবেন না)</label>
      <input id="fb_path" value="${m.firebasePath||'coaching_data'}">
      <button class="btn" id="saveFbBtn">সংরক্ষণ করুন ও সিঙ্ক চালু করুন</button>
      <button class="btn secondary" id="forceSyncBtn" style="margin-top:8px">🔄 এখনই সিঙ্ক করুন</button>
      <p id="fbStatus" style="font-size:12px;color:var(--muted);margin-top:8px"></p>
    </div>
    <div class="card">
      <h2>ডেটা ব্যাকআপ</h2>
      ${db.meta.lastBackupDate?`<p style="font-size:12px;color:var(--muted)">সর্বশেষ ব্যাকআপ: ${fmtDate(db.meta.lastBackupDate)}</p>`:`<p style="font-size:12px;color:var(--danger)">এখনো কোনো ব্যাকআপ নেওয়া হয়নি</p>`}
      <button class="btn secondary" id="exportBtn">⬇ ব্যাকআপ ডাউনলোড করুন (JSON)</button>
      <label style="margin-top:14px">ব্যাকআপ ফাইল থেকে পুনরুদ্ধার করুন</label>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div class="card">
      <h2 style="color:var(--danger)">বিপজ্জনক এলাকা</h2>
      <button class="btn danger" id="resetBtn">সব ডেটা মুছে ফেলুন</button>
    </div>
  `;
  document.getElementById('saveInfoBtn').addEventListener('click', ()=>{
    db.meta.instituteName = document.getElementById('set_name').value.trim() || "Educare Coaching";
    db.meta.institutePhone = document.getElementById('set_phone').value.trim();
    db.meta.instituteAddress = document.getElementById('set_addr').value.trim();
    save(); toast("সংরক্ষণ হয়েছে");
  });
  document.getElementById('set_logo').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{ db.meta.logoDataUrl = ev.target.result; save(); toast("লোগো সংরক্ষণ হয়েছে"); renderSettings(); };
    reader.readAsDataURL(file);
  });
  const rmBtn = document.getElementById('rmLogoBtn');
  if(rmBtn) rmBtn.addEventListener('click', ()=>{ db.meta.logoDataUrl=null; save(); renderSettings(); });
  document.getElementById('saveFeeBtn').addEventListener('click', ()=>{
    document.querySelectorAll('.classFeeInput').forEach(inp=>{
      db.classFees[inp.dataset.class] = Number(inp.value||0);
    });
    save(); toast("ফি হালনাগাদ হয়েছে");
  });
  setupEditableList('listPayMethods','newPayMethod','addPayMethodBtn', db.settings.payMethods);
  setupEditableList('listExpCats','newExpCat','addExpCatBtn', db.settings.expCats);
  setupEditableList('listExamTypes','newExamType','addExamTypeBtn', db.settings.examTypes, (val)=>{
    db.settings.subjectTemplates[val] = [{name:"",full:100},{name:"",full:100},{name:"",full:100}];
  });
  document.getElementById('saveFbBtn').addEventListener('click', async ()=>{
    db.meta.firebaseUrl = document.getElementById('fb_url').value.trim();
    db.meta.firebasePath = document.getElementById('fb_path').value.trim() || "coaching_data";
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
    toast("সংরক্ষণ হয়েছে, সিঙ্ক শুরু হচ্ছে...");
    startCloudPollingIfNeeded();
    await pushToCloud();
    document.getElementById('fbStatus').textContent = syncLabel();
  });
  document.getElementById('forceSyncBtn').addEventListener('click', async ()=>{
    const status = document.getElementById('fbStatus');
    if(!db.meta.firebaseUrl){ toast("আগে Firebase URL সংরক্ষণ করুন"); return; }
    status.textContent = "সিঙ্ক করা হচ্ছে...";
    await checkCloudForUpdates();
    await pushToCloud();
    status.textContent = syncLabel() + " — সর্বশেষ: " + new Date().toLocaleTimeString('en-GB');
  });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "coaching-backup-" + todayStr() + ".json";
    a.click();
    db.meta.lastBackupDate = todayStr();
    save();
    toast("ব্যাকআপ ডাউনলোড হয়েছে");
  });
  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const data = JSON.parse(evt.target.result);
        db = migrate(data); save(); toast("পুনরুদ্ধার সম্পন্ন হয়েছে"); showTab('dashboard');
      }catch(err){ toast("ফাইলটি সঠিক নয়"); }
    };
    reader.readAsText(file);
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm("আপনি কি নিশ্চিত? সব ডেটা স্থায়ীভাবে মুছে যাবে!")){
      db = defaultDB(); save(); toast("সব ডেটা মুছে ফেলা হয়েছে"); showTab('dashboard');
    }
  });
}

/* ================== EDITABLE LISTS (self-customization) ================== */
function setupEditableList(listId, inputId, btnId, arr, onAdd){
  function renderChips(){
    const wrap = document.getElementById(listId);
    if(arr.length===0){ wrap.innerHTML = `<span style="font-size:12px;color:var(--muted)">কোনো আইটেম নেই</span>`; return; }
    wrap.innerHTML = arr.map((item,i)=>`<button type="button" data-i="${i}">${item} ✕</button>`).join("");
    wrap.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(arr.length<=1){ toast("অন্তত একটি আইটেম থাকা আবশ্যক"); return; }
        arr.splice(Number(b.dataset.i),1);
        save(); renderChips();
      });
    });
  }
  renderChips();
  document.getElementById(btnId).addEventListener('click', ()=>{
    const inp = document.getElementById(inputId);
    const val = inp.value.trim();
    if(!val){ return; }
    if(arr.includes(val)){ toast("এটি ইতিমধ্যে তালিকায় আছে"); return; }
    arr.push(val);
    if(onAdd) onAdd(val);
    save(); inp.value=""; renderChips();
  });
}

/* ================== GLOBAL SAFETY NET ================== */
window.addEventListener('error', function(e){
  console.error('App error:', e.error||e.message);
  try{ toast("সাময়িক একটি সমস্যা হয়েছে — ডেটা নিরাপদ আছে"); }catch(_){}
  e.preventDefault();
});
window.addEventListener('unhandledrejection', function(e){
  console.error('App promise error:', e.reason);
  e.preventDefault();
});

/* ================== INIT ================== */
showTab('dashboard');
let cloudPollStarted = false;
function startCloudPollingIfNeeded(){
  if(cloudPollStarted || !db.meta.firebaseUrl) return;
  cloudPollStarted = true;
  checkCloudForUpdates();
  setInterval(checkCloudForUpdates, 15000);
}
startCloudPollingIfNeeded();
</script>
</body>
</html>
