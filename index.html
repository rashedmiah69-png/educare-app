<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educare Coaching App</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">এজুকেয়ার কোচিং ম্যানেজমেন্ট</h1>
            <button id="settingsBtn" onclick="toggleSettings()" class="text-2xl">⚙️</button>
        </div>

        <!-- Live Sync Status -->
        <div id="statusContainer" class="mb-4 p-3 rounded-lg bg-gray-50 flex items-center gap-2">
            <span id="statusDot" class="w-3 h-3 rounded-full bg-gray-400"></span>
            <span id="statusText" class="text-sm font-medium text-gray-600">লাইভ সিঙ্ক বন্ধ রয়েছে</span>
        </div>

        <!-- Settings Modal / Panel -->
        <div id="settingsPanel" class="hidden mb-6 p-4 border border-blue-200 rounded-lg bg-blue-50">
            <h2 class="font-semibold text-blue-900 mb-3">লাইভ সিঙ্ক ও একাধিক ডিভাইস</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Firebase Database URL</label>
                    <input type="text" id="fireUrl" placeholder="https://your-app-default-rtdb.firebaseio.com" class="w-full text-xs p-2 border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">গোপন পাঠ (Secret Code)</label>
                    <input type="password" id="fireSecret" placeholder="যেমন: edu_9f81xk" class="w-full text-xs p-2 border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <button onclick="saveSettings()" class="w-full bg-blue-600 text-white text-xs font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    সংরক্ষণ করুন ও সিঙ্ক চালু করুন
                </button>
            </div>
        </div>

        <!-- Main App Content -->
        <div id="appContent" class="space-y-4">
            <div class="border p-4 rounded-lg">
                <h3 class="font-semibold text-sm mb-2">স্টুডেন্ট তথ্য / ডাটা টেস্ট</h3>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="studentName" placeholder="শিক্ষার্থীর নাম" class="flex-1 text-xs p-2 border rounded">
                    <button onclick="addStudent()" class="bg-green-600 text-white text-xs px-3 py-2 rounded">যোগ করুন</button>
                </div>
                <ul id="studentList" class="divide-y divide-gray-200 text-xs text-gray-700 max-h-40 overflow-y-auto">
                    <li class="py-2 text-center text-gray-400">কোনো ডাটা পাওয়া যায়নি</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        let dbUrl = localStorage.getItem('fb_url') || '';
        let dbSecret = localStorage.getItem('fb_secret') || '';

        document.addEventListener("DOMContentLoaded", () => {
            if(dbUrl) document.getElementById('fireUrl').value = dbUrl;
            if(dbSecret) document.getElementById('fireSecret').value = dbSecret;
            checkSyncStatus();
            if(dbUrl) fetchStudents();
        });

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function checkSyncStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if(dbUrl && dbSecret) {
                dot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                text.innerText = "🟢 লাইভ সিঙ্ক চালু";
                text.className = "text-sm font-medium text-green-700";
            } else {
                dot.className = "w-3 h-3 rounded-full bg-red-400";
                text.innerText = "🔴 সিঙ্ক বন্ধ (সেটিংস পূর্ণ করুন)";
                text.className = "text-sm font-medium text-red-600";
            }
        }

        function saveSettings() {
            const url = document.getElementById('fireUrl').value.trim();
            const secret = document.getElementById('fireSecret').value.trim();

            if(!url) {
                alert("Firebase Database URL দিন!");
                return;
            }

            // Ensure trailing slash
            dbUrl = url.endsWith('/') ? url : url + '/';
            dbSecret = secret;

            localStorage.setItem('fb_url', dbUrl);
            localStorage.setItem('fb_secret', dbSecret);

            checkSyncStatus();
            toggleSettings();
            fetchStudents();
            alert("সেটিংস সফলভাবে সংরক্ষিত হয়েছে!");
        }

        async function fetchStudents() {
            if(!dbUrl) return;
            try {
                const response = await fetch(`${dbUrl}students.json`);
                const data = await response.json();
                const list = document.getElementById('studentList');
                list.innerHTML = '';
                
                if(data) {
                    Object.keys(data).forEach(key => {
                        const li = document.createElement('li');
                        li.className = 'py-2 flex justify-between items-center';
                        li.innerText = data[key].name;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li class="py-2 text-center text-gray-400">কোনো রেকর্ড নেই</li>';
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function addStudent() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();
            if(!name) return alert("নাম লিখুন!");
            if(!dbUrl) return alert("আগে সেটিংসে গিয়ে Firebase URL সেভ করুন!");

            try {
                await fetch(`${dbUrl}students.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, timestamp: Date.now() })
                });
                nameInput.value = '';
                fetchStudents();
            } catch(e) {
                alert("ডাটা পাঠাতে সমস্যা হয়েছে!");
            }
        }
    </script>
</body>
</html>
