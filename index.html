<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"><title>কোচিং ম্যানেজার</title><style>
  :root{ --primary:#1F4E78; --primary-light:#2E6DA4; --accent:#2e7d32; --danger:#b02a2a; --warn:#b06a00; --bg:#f3f5f8; --card:#ffffff; --border:#e0e4ea; --text:#22303f; --muted:#6b7684; --yellow:#fff2cc; --green:#e2efda; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans Bengali','Nirmala UI','Kalpurush',sans-serif; padding-bottom:70px; }
  header{ background:var(--primary); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; }
  header h1{font-size:18px; margin:0;} header .sub{font-size:11px; opacity:.85;}
  nav.tabs{ display:flex; overflow-x:auto; background:#173a5c; position:sticky; top:52px; z-index:19; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ flex:0 0 auto; background:none; border:none; color:#cfe0f0; padding:10px 14px; font-size:13px; font-family:inherit; white-space:nowrap; border-bottom:3px solid transparent; cursor:pointer; }
  nav.tabs button.active{color:#fff; border-bottom-color:#ffb703; font-weight:bold;}
  main{padding:12px; max-width:900px; margin:0 auto;}
  .card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--primary);}
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .kpi .val{font-size:19px; font-weight:bold; color:var(--primary);}
  .kpi.profit .val{color:var(--accent);} .kpi.due .val{color:var(--danger);}
  .kpi .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select, textarea{ width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px; font-family:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary-light); border-color:var(--primary-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  button.btn{ background:var(--primary); color:#fff; border:none; border-radius:7px; padding:10px 14px; font-size:14px; font-family:inherit; margin-top:10px; width:100%; cursor:pointer; }
  button.btn.secondary{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  button.btn.danger{background:var(--danger);}
  button.btn.small{width:auto; padding:6px 10px; font-size:12px; margin:0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:7px 6px; border-bottom:1px solid var(--border); text-align:right;}
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2){text-align:left;}
  th{background:#f0f3f7; color:var(--primary); font-size:12px;}
  .table-wrap{overflow-x:auto;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;}
  .pill.ok{background:var(--green); color:var(--accent);}
  .pill.warn{background:var(--yellow); color:#7a5b00;}
  .pill.bad{background:#fbe4e4; color:var(--danger);}
  .search-box{display:flex; gap:8px; margin-bottom:10px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:13px;}
  .profile-grid .k{color:var(--muted);} .profile-grid .v{font-weight:bold;}
  .receipt{border:2px solid var(--primary); border-radius:10px; padding:18px; background:#fff;}
  .print-header{display:flex; align-items:center; gap:12px; margin-bottom:10px; border-bottom:2px solid var(--primary); padding-bottom:10px;}
  .print-header .logo-fallback{ height:52px; width:52px; border-radius:8px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px; }
  .print-header .pinfo{flex:1;}
  .print-header .pname{font-size:19px; font-weight:bold; color:var(--primary); margin:0;}
  .print-header .pmeta{font-size:11px; color:var(--muted);}
  .doc-title{text-align:center; font-size:13px; font-weight:bold; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .amount-box{ text-align:center; font-size:22px; font-weight:bold; color:var(--accent); border:1px dashed var(--accent); border-radius:8px; padding:8px; margin:10px 0; }
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .tag-row button{ border:1px solid var(--border); background:#fff; border-radius:20px; padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; }
  .tag-row button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .att-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .att-item{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1 1 45%; display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:6px; }
  .att-toggle{border:none; border-radius:20px; padding:5px 12px; font-size:12px; font-family:inherit; color:#fff; min-width:80px; cursor:pointer;}
  .att-toggle.present{background:var(--accent);} .att-toggle.absent{background:var(--danger);} .att-toggle.leave{background:var(--warn);}
  .subj-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .subj-row input{flex:1;} .subj-row input.full-inp{max-width:70px;} .subj-row input.obt-inp{max-width:70px;}
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show{opacity:1;}
  @media print{ header, nav.tabs, .no-print{display:none !important;} main{padding:0;} body{padding:0;} }
</style></head><body>

<header>
  <div>
    <h1>কোচিং ম্যানেজার</h1>
    <div class="sub" id="headerSub">সব ডেটা এই ফোনেই সংরক্ষিত থাকে</div>
  </div>
  <button class="btn small secondary no-print" onclick="showTab('settings')">⚙ সেটিংস</button>
</header>

<nav class="tabs no-print" id="tabNav">
  <button data-tab="dashboard">ড্যাশবোর্ড</button>
  <button data-tab="students">স্টুডেন্ট</button>
  <button data-tab="payments">পেমেন্ট</button>
  <button data-tab="attendance">উপস্থিতি</button>
  <button data-tab="exams">পরীক্ষা</button>
  <button data-tab="reports">রিপোর্ট</button>
  <button data-tab="staff">স্টাফ ও বেতন</button>
  <button data-tab="expenses">অন্যান্য ব্যয়</button>
  <button data-tab="search">🔍 সার্চ</button>
  <button data-tab="summary">সারসংক্ষেপ</button>
</nav>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const CLASSES = ["ষষ্ঠ শ্রেণী","সপ্তম শ্রেণী","অষ্টম শ্রেণী","নবম শ্রেণী","দশম শ্রেণী","একাদশ শ্রেণী","দ্বাদশ শ্রেণী"];
const CLASS_CODE = {"ষষ্ঠ শ্রেণী":"6","সপ্তম শ্রেণী":"7","অষ্টম শ্রেণী":"8","নবম শ্রেণী":"9","দশম শ্রেণী":"10","একাদশ শ্রেণী":"11","দ্বাদশ শ্রেণী":"12"};
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const SUBJECTS = ["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","আইসিটি"];
const PAY_METHODS = ["নগদ","বিকাশ","রকেট","ব্যাংক"];
const EXP_CATS = ["ভাড়া","বিদ্যুৎ বিল","স্টেশনারি","ইন্টারনেট","অন্যান্য"];
const EXAM_TYPES = ["ক্লাস টেস্ট","মাসিক টেস্ট","মডেল টেস্ট"];
const STORE_KEY = "coachingAppData_v2";

function defaultDB(){
  const classFees = {}; CLASSES.forEach(c=>classFees[c]=800);
  return {
    meta:{ classSeq:{}, receiptSeq:0, staffSeq:0, expenseSeq:0, examSeq:0, instituteName:"Educare Coaching", institutePhone:"01717046168", instituteAddress:"Gobindaganj, Gaibandha", logoDataUrl:null, firebaseUrl:"", firebasePath:"coaching_data", updatedAt:0 },
    classFees,
    settings:{ payMethods:[...PAY_METHODS], expCats:[...EXP_CATS], examTypes:[...EXAM_TYPES], gradeScale:[{min:80,label:"A+"},{min:70,label:"A"},{min:60,label:"A-"},{min:50,label:"B"},{min:40,label:"C"},{min:0,label:"F"}] },
    students:[], payments:[], attendance:[], exams:[], staff:[], staffPayments:[], expenses:[]
  };
}

let db = load();
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return Object.assign(defaultDB(), JSON.parse(raw)); }catch(e){}
  return defaultDB();
}

function save(){
  db.meta.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
  pushToCloud();
}

async function pushToCloud(){
  if(!db.meta.firebaseUrl) return;
  try{
    const url = `${db.meta.firebaseUrl.replace(/\/$/,"")}/${(db.meta.firebasePath||"coaching_data").replace(/^\/|\/$/g,"")}.json`;
    await fetch(url, { method:'PUT', body: JSON.stringify(db) });
  }catch(e){}
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function pad(n,len){ return String(n).padStart(len,"0"); }
function nextStudentId(cls){ db.meta.classSeq[cls] = (db.meta.classSeq[cls]||0)+1; return `${CLASS_CODE[cls]}-${pad(db.meta.classSeq[cls],3)}`; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return "৳" + Math.round(n||0).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return "-"; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function getStudent(id){ return db.students.find(s=>s.id===id); }
function activeStudents(cls){
  let list = db.students.filter(s=>s.status!=="নিষ্ক্রিয়");
  if(cls && cls!=="সব") list = list.filter(s=>s.class===cls);
  return list;
}

function studentPayments(id){ return db.payments.filter(p=>p.studentId===id); }
function studentTotalPaid(id){ return studentPayments(id).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentExpectedTotal(st){
  if(!st.admissionDate) return 0;
  const adm = new Date(st.admissionDate); const now = new Date();
  let months = (now.getFullYear()-adm.getFullYear())*12 + (now.getMonth()-adm.getMonth()) + 1;
  return Math.max(0, months) * Number(st.fee||0);
}
function studentDue(st){ return studentExpectedTotal(st) - studentTotalPaid(st.id); }

function printHeaderHtml(docTitle){
  const m = db.meta;
  return `<div class="print-header">
    <div class="logo-fallback">${(m.instituteName||"EC").slice(0,2).toUpperCase()}</div>
    <div class="pinfo"><div class="pname">${m.instituteName||""}</div><div class="pmeta">${m.instituteAddress||""} · Phone: ${m.institutePhone||""}</div></div>
  </div><div class="doc-title">${docTitle}</div>`;
}

let currentTab = 'dashboard';
document.getElementById('tabNav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]');
  if(b) showTab(b.dataset.tab);
});

function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = "";
  const fns = {
    dashboard: renderDashboard, students: renderStudents, payments: renderPayments,
    attendance: renderAttendance, exams: renderExams, reports: renderDashboard,
    staff: renderStaff, expenses: renderExpenses, summary: renderDashboard,
    settings: renderSettings, search: renderSearch, studentProfile: renderStudentProfile,
    receipt: renderReceipt, reportCard: renderReportCard
  };
  try{ (fns[currentTab]||renderDashboard)(); }catch(err){ app.innerHTML = `<div class="card"><div class="empty">সমস্যা হয়েছে, অন্য ট্যাবে ক্লিক করুন।</div></div>`; }
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
  const app = document.getElementById('app');
  const curMonth = MONTHS[new Date().getMonth()];
  const curYear = new Date().getFullYear();
  
  const income = db.payments.filter(p=>new Date(p.date).getFullYear()===curYear && p.forMonth===curMonth).reduce((s,p)=>s+Number(p.amount||0),0);
  const totalExpense = db.expenses.filter(e=>new Date(e.date).getFullYear()===curYear).reduce((s,e)=>s+Number(e.amount||0),0) + db.staffPayments.filter(s=>new Date(s.date).getFullYear()===curYear).reduce((s,p)=>s+Number(p.amount||0),0);
  const totalDue = activeStudents().reduce((s,st)=>s+Math.max(0,studentDue(st)),0);

  app.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="val">${activeStudents().length}</div><div class="lbl">সক্রিয় স্টুডেন্ট</div></div>
      <div class="kpi"><div class="val">${fmtMoney(income)}</div><div class="lbl">${curMonth} মাসের আয়</div></div>
      <div class="kpi"><div class="val">${fmtMoney(totalExpense)}</div><div class="lbl">মোট ব্যয়</div></div>
      <div class="kpi due" style="grid-column:span 2"><div class="val">${fmtMoney(totalDue)}</div><div class="lbl">মোট বকেয়া</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>দ্রুত কাজ</h2>
      <div class="row2">
        <button class="btn secondary" onclick="showTab('payments')">💳 ফি জমা নিন</button>
        <button class="btn secondary" onclick="showTab('attendance')">📅 হাজিরা নিন</button>
      </div>
    </div>`;
}

// ---------------- STUDENTS ----------------
let studentSearch = ""; let studentClassFilter = "সব"; let editingStudentId = null;
function renderStudents(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card"><h2>${editingStudentId ? "তথ্য পরিবর্তন" : "নতুন স্টুডেন্ট যোগ"}</h2><form id="studentForm"></form></div>
    <div class="card">
      <h2>স্টুডেন্ট তালিকা (${db.students.length})</h2>
      <div class="tag-row" id="stuClassTags"></div>
      <div class="search-box"><input id="stuSearch" placeholder="নাম বা আইডি দিয়ে খুঁজুন..." value="${studentSearch}"></div>
      <div class="table-wrap" id="stuTableWrap"></div>
    </div>`;
  
  buildStudentForm();
  const tagWrap = document.getElementById('stuClassTags');
  tagWrap.innerHTML = ["সব",...CLASSES].map(c=>`<button data-c="${c}" class="${studentClassFilter===c?'active':''}">${c}</button>`).join("");
  tagWrap.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ studentClassFilter=b.dataset.c; renderStudents(); } });
  document.getElementById('stuSearch').addEventListener('input', e=>{ studentSearch=e.target.value; renderStudentTable(); });
  renderStudentTable();
}

function buildStudentForm(){
  const editing = editingStudentId ? getStudent(editingStudentId) : null;
  const f = document.getElementById('studentForm');
  f.innerHTML = `
    <label>নাম</label><input id="f_name" value="${editing?editing.name:''}" required>
    <div class="row2">
      <div><label>শ্রেণী</label><select id="f_class">${CLASSES.map(c=>`<option ${editing&&editing.class===c?'selected':''}>${c}</option>`).join("")}</select></div>
      <div><label>ফি (৳)</label><input id="f_fee" type="number" value="${editing?editing.fee:(db.classFees[CLASSES[0]]||800)}"></div>
    </div>
    <div class="row2">
      <div><label>অভিভাবক</label><input id="f_guardian" value="${editing?editing.guardian||'':''}"></div>
      <div><label>মোবাইল</label><input id="f_phone" value="${editing?editing.phone||'':''}"></div>
    </div>
    <div class="row2">
      <div><label>ভর্তির তারিখ</label><input id="f_admission" type="date" value="${editing?editing.admissionDate:todayStr()}"></div>
      <div><label>অবস্থা</label><select id="f_status"><option ${editing&&editing.status==='সক্রিয়'?'selected':''}>সক্রিয়</option><option ${editing&&editing.status==='নিষ্ক্রিয়'?'selected':''}>নিষ্ক্রিয়</option></select></div>
    </div>
    <button type="submit" class="btn">${editing?'হালনাগাদ':'যোগ করুন'}</button>
    ${editing?'<button type="button" class="btn secondary" onclick="editingStudentId=null;renderStudents()">বাতিল</button>':''}`;
  
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const data = {
      name: document.getElementById('f_name').value.trim(),
      class: document.getElementById('f_class').value,
      fee: Number(document.getElementById('f_fee').value||0),
      guardian: document.getElementById('f_guardian').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      admissionDate: document.getElementById('f_admission').value,
      status: document.getElementById('f_status').value
    };
    if(editing){ Object.assign(editing, data); editingStudentId=null; }
    else{ data.id = nextStudentId(data.class); db.students.push(data); }
    save(); toast("সংরক্ষিত হয়েছে"); renderStudents();
  });
}

function renderStudentTable(){
  const wrap = document.getElementById('stuTableWrap');
  const q = studentSearch.trim().toLowerCase();
  let list = db.students;
  if(studentClassFilter!=="সব") list = list.filter(s=>s.class===studentClassFilter);
  if(q) list = list.filter(s=>s.id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));
  if(list.length===0){ wrap.innerHTML = `<div class="empty">স্টুডেন্ট পাওয়া যায়নি</div>`; return; }
  wrap.innerHTML = `<table><tr><th>আইডি</th><th>নাম</th><th>শ্রেণী</th><th>বকেয়া</th><th></th></tr>
    ${list.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.class}</td><td>${studentDue(s)>0?`<span class="pill bad">${fmtMoney(studentDue(s))}</span>`:`<span class="pill ok">নেই</span>`}</td><td><button class="btn small secondary" onclick="openProfile('${s.id}')">প্রোফাইল</button></td></tr>`).join("")}
  </table>`;
}

let profileStudentId = null;
function openProfile(id){ profileStudentId = id; currentTab='studentProfile'; render(); }
function renderStudentProfile(){
  const app = document.getElementById('app');
  const s = getStudent(profileStudentId);
  if(!s) return;
  const history = studentPayments(s.id);
  app.innerHTML = `
    <button class="btn secondary no-print" onclick="showTab('students')">← ফিরে যান</button>
    <div class="card" style="margin-top:10px">
      <h2>${s.name} (${s.id})</h2>
      <div class="profile-grid">
        <div class="k">শ্রেণী:</div><div class="v">${s.class}</div>
        <div class="k">মোবাইল:</div><div class="v">${s.phone||'-'}</div>
        <div class="k">অভিভাবক:</div><div class="v">${s.guardian||'-'}</div>
        <div class="k">মাসিক ফি:</div><div class="v">${fmtMoney(s.fee)}</div>
        <div class="k">মোট বকেয়া:</div><div class="v" style="color:var(--danger)">${fmtMoney(Math.max(0,studentDue(s)))}</div>
      </div>
      <button class="btn secondary small" style="margin-top:10px" onclick="editingStudentId='${s.id}';showTab('students')">সম্পাদনা করুন</button>
    </div>
    <div class="card">
      <h2>পেমেন্ট হিস্ট্রি</h2>
      <div class="table-wrap">

let attClassFilter = CLASSES[0]; let attDate = todayStr();
function renderAttendance(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>উপস্থিতি রেজিস্টার</h2>
      <div class="row2">
        <div><label>শ্রেণী</label><select id="att_class">${CLASSES.map(c=>`<option ${c===attClassFilter?'selected':''}>${c}</option>`).join("")}</select></div>
        <div><label>তারিখ</label><input id="att_date" type="date" value="${attDate}"></div>
      </div>
    </div>
    <div class="card">
      <h2>স্টুডেন্ট তালিকা</h2>
      <div class="att-grid" id="attList"></div>
      <button class="btn" style="margin-top:14px" onclick="saveAttendance()">উপস্থিতি সেভ করুন</button>
    </div>`;

  document.getElementById('att_class').addEventListener('change', e=>{ attClassFilter=e.target.value; renderAttList(); });
  document.getElementById('att_date').addEventListener('change', e=>{ attDate=e.target.value; renderAttList(); });
  renderAttList();
}

let currentAttState = {};
function renderAttList(){
  const wrap = document.getElementById('attList');
  const stus = activeStudents(attClassFilter);
  if(stus.length===0){ wrap.innerHTML = `<div class="empty">এই শ্রেণীতে কোনো স্টুডেন্ট নেই</div>`; return; }
  
  currentAttState = {};
  stus.forEach(s=>{
    const existing = db.attendance.find(a=>a.studentId===s.id && a.date===attDate);
    currentAttState[s.id] = existing ? existing.status : "উপস্থিত";
  });

  wrap.innerHTML = stus.map(s=>`
    <div class="att-item">
      <div><b>${s.name}</b><br><small>${s.id}</small></div>
      <button class="att-toggle ${currentAttState[s.id]==='উপস্থিত'?'present':currentAttState[s.id]==='অনুপস্থিত'?'absent':'leave'}" onclick="toggleAtt('${s.id}', this)">${currentAttState[s.id]}</button>
    </div>`).join("");
}

function toggleAtt(id, btn){
  const states = ["উপস্থিত", "অনুপস্থিত", "ছুটি"];
  let curr = currentAttState[id];
  let next = states[(states.indexOf(curr)+1)%states.length];
  currentAttState[id] = next;
  btn.textContent = next;
  btn.className = `att-toggle ${next==='উপস্থিত'?'present':next==='অনুপস্থিত'?'absent':'leave'}`;
}

function saveAttendance(){
  Object.keys(currentAttState).forEach(id=>{
    db.attendance = db.attendance.filter(a=>!(a.studentId===id && a.date===attDate));
    db.attendance.push({ studentId: id, date: attDate, status: currentAttState[id] });
  });
  save(); toast("উপস্থিতি সংরক্ষণ করা হয়েছে");
}

        </div>
      `).join("")}

function saveExamMarks(exId){
  const ex = db.exams.find(e=>e.id===exId);
  if(!ex) return;
  const stus = activeStudents(ex.class);
  stus.forEach(s=>{
    const val = document.getElementById(`m_${s.id}`).value;
    if(val!=="") ex.marks[s.id] = Number(val);
  });
  save(); toast("নম্বর সংরক্ষিত হয়েছে");
}
